<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reader redesign — full interactive reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Scheherazade+New:wght@400;500;700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
         THEME TOKENS — verbatim from the real reader tokens.css.
         Reader defaults: classical theme, both languages, contents open.
         ============================================================ */
      :root {
        --night-900: #100d08;
        --night-800: #15110b;
        --night-700: #1a1610;
        --night-600: #221c14;
        --night-500: #2c2519;
        --sand-100: #ede5d2;
        --sand-300: #b6ab94;
        --gold-300: #cba955;
        --gold-400: #b39140;
        --gold-500: #8a6e2c;
        --ar-display: 'Amiri', serif;
        --ar-body: 'Scheherazade New', 'Amiri', serif;
        --en: 'IBM Plex Sans', system-ui, sans-serif;
        --reader-size: 19px;
        --ctl-h: 32px;
        --radius-control: 5px; /* was 9px — your "too rounded" fix */
        --radius-chip: 6px;
      }
      [data-theme='classical'] {
        --rd-bg: #faf7ef;
        --rd-fg: #342d20;
        --rd-muted: #877c67;
        --rd-border: rgba(52, 45, 32, 0.13);
        --rd-toolbar-bg: #f2ecdd;
        --rd-pill-bg: #e8dec8;
        --rd-card: #f5efe1;
        --rd-card-active: #efe7d3;
        --rd-accent: #997b34;
        --rd-rule: #d9ccac;
        --rd-match: #f1d27a;
        --rd-field-bg: #fbf8f0;
        --rd-starfield: none;
      }
      [data-theme='dark'] {
        --rd-bg: var(--night-900);
        --rd-fg: var(--sand-100);
        --rd-muted: var(--sand-300);
        --rd-border: var(--night-500);
        --rd-toolbar-bg: var(--night-700);
        --rd-pill-bg: var(--night-600);
        --rd-card: var(--night-800);
        --rd-card-active: var(--night-700);
        --rd-accent: var(--gold-300);
        --rd-rule: var(--night-500);
        --rd-match: rgba(203, 169, 85, 0.34);
        --rd-field-bg: var(--night-600);
        --rd-starfield:
          radial-gradient(1px 1px at 18% 22%, rgba(237, 229, 210, 0.5), transparent),
          radial-gradient(1px 1px at 72% 14%, rgba(203, 169, 85, 0.45), transparent),
          radial-gradient(1.3px 1.3px at 41% 64%, rgba(237, 229, 210, 0.35), transparent),
          radial-gradient(1.2px 1.2px at 88% 48%, rgba(237, 229, 210, 0.4), transparent),
          radial-gradient(1px 1px at 9% 80%, rgba(203, 169, 85, 0.4), transparent);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: var(--en);
        background: #07060a;
        color: var(--rd-fg);
      }

      /* ---- mockup-only control strip ---- */
      .demobar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        padding: 9px 16px;
        background: #07060a;
        border-bottom: 1px solid #211c2b;
        color: #b9b2c8;
        font-size: 12px;
      }
      .demobar strong {
        color: #efeaf6;
        font-weight: 600;
      }
      .demobar .seg {
        display: inline-flex;
        border: 1px solid #2c2738;
        border-radius: 6px;
        overflow: hidden;
      }
      .demobar .seg button {
        border: 0;
        background: transparent;
        color: #b9b2c8;
        font: inherit;
        padding: 5px 11px;
        cursor: pointer;
      }
      .demobar .seg button[aria-pressed='true'] {
        background: #6d5bd0;
        color: #fff;
      }
      .demobar .hint {
        color: #6f6885;
      }
      .demobar .draft {
        color: #c9a24a;
      }

      /* ============================================================ READER */
      .reader-root {
        height: calc(100vh - 41px);
        display: flex;
        flex-direction: column;
        background: var(--rd-bg);
        background-image: var(--rd-starfield);
        font-size: var(--reader-size);
        transition:
          background 0.2s,
          color 0.2s;
      }

      /* ---- TOOLBAR ---- */
      .toolbar {
        flex: none;
        background: var(--rd-toolbar-bg);
        border-bottom: 1px solid var(--rd-border);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 20px;
      }
      .row + .row {
        border-top: 1px solid var(--rd-border);
      }
      .row--pager {
        justify-content: center;
        gap: 8px;
      }
      .row--settings {
        justify-content: space-between;
      }
      .group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .ctl {
        height: var(--ctl-h);
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 0 11px;
        border: 1px solid var(--rd-border);
        border-radius: var(--radius-control);
        background: var(--rd-pill-bg);
        color: var(--rd-fg);
        font-family: var(--en);
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      .ctl:hover {
        border-color: var(--rd-accent);
      }
      .ctl--ghost {
        background: transparent;
      }
      .ctl[aria-pressed='true'] {
        border-color: var(--rd-accent);
        background: var(--rd-card-active);
      }
      .ctl[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .ctl svg {
        width: 15px;
        height: 15px;
        stroke: var(--rd-accent);
        fill: none;
        flex: none;
      }
      .btn-catalog {
        flex: none;
      }
      .vrule {
        width: 1px;
        align-self: stretch;
        background: var(--rd-border);
        margin: 5px 0;
      }

      .segmented {
        display: inline-flex;
        height: var(--ctl-h);
        border: 1px solid var(--rd-border);
        border-radius: var(--radius-control);
        overflow: hidden;
        background: var(--rd-pill-bg);
      }
      .segmented button {
        border: 0;
        background: transparent;
        color: var(--rd-muted);
        font: inherit;
        font-size: 12.5px;
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      .segmented button svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
      }
      .segmented button[aria-pressed='true'] {
        background: var(--rd-card-active);
        color: var(--rd-fg);
        box-shadow: inset 0 0 0 1px var(--rd-accent);
      }
      .segmented button + button {
        border-left: 1px solid var(--rd-border);
      }

      .stepper {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: var(--ctl-h);
        padding: 0 6px;
        border: 1px solid var(--rd-border);
        border-radius: var(--radius-control);
        background: var(--rd-pill-bg);
        font-size: 12.5px;
        color: var(--rd-muted);
      }
      .stepper button {
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--rd-fg);
        font-size: 15px;
        cursor: pointer;
      }
      .stepper button:hover {
        background: var(--rd-card-active);
      }

      /* ---- MASTHEAD ---- */
      .masthead {
        flex: 1 1 auto;
        min-width: 0;
      }
      /* EDITORIAL — left-anchored, one baseline like your example:
         Arabic · Romanized · Author, then a badge line under it. */
      [data-masthead='editorial'] .masthead {
        text-align: start;
      }
      [data-masthead='editorial'] .mh-title {
        display: flex;
        align-items: baseline;
        gap: 9px;
        min-width: 0;
      }
      [data-masthead='editorial'] .mh-ar {
        font-family: var(--ar-display);
        font-weight: 700;
        font-size: 22px;
        line-height: 1.2;
        color: var(--rd-fg);
        direction: rtl;
        white-space: nowrap;
      }
      [data-masthead='editorial'] .mh-rom {
        font-family: var(--en);
        font-size: 14px;
        color: var(--rd-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      [data-masthead='editorial'] .mh-sep {
        color: var(--rd-muted);
        opacity: 0.6;
      }
      [data-masthead='editorial'] .badges {
        margin-top: 5px;
      }

      /* HERO — title becomes a centered band; row 1 keeps Catalog + search. */
      [data-masthead='hero'] .masthead {
        display: none;
      }
      .hero-band {
        display: none;
        position: relative;
        text-align: center;
        padding: 18px 24px 16px;
        border-top: 1px solid var(--rd-border);
        background: var(--rd-toolbar-bg);
      }
      [data-masthead='hero'] .hero-band {
        display: block;
      }
      .hero-band::before {
        content: '';
        position: absolute;
        inset: -30% 25% auto 25%;
        height: 150px;
        background: radial-gradient(
          60% 100% at 50% 0%,
          color-mix(in oklab, var(--rd-accent) 22%, transparent),
          transparent 70%
        );
        pointer-events: none;
      }
      .hero-ar {
        position: relative;
        font-family: var(--ar-display);
        font-weight: 700;
        font-size: clamp(26px, 3.6vw, 38px);
        line-height: 1.25;
        color: var(--rd-fg);
        direction: rtl;
        margin: 0 auto;
        max-width: 26ch;
      }
      .hero-en {
        position: relative;
        font-family: var(--ar-display);
        font-style: italic;
        font-size: clamp(15px, 1.7vw, 19px);
        color: var(--rd-accent);
        margin-top: 5px;
      }
      .hero-author {
        position: relative;
        font-family: var(--ar-body);
        font-size: 16px;
        color: var(--rd-muted);
        direction: rtl;
        margin-top: 7px;
      }
      .hero-badges {
        position: relative;
        margin-top: 11px;
      }

      /* ---- BADGES ---- */
      .badges {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 9px;
        border-radius: var(--radius-chip);
        font-family: var(--en);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.02em;
        border: 1px solid var(--rd-border);
        color: var(--rd-muted);
        background: var(--rd-card);
      }
      .badge svg {
        width: 12px;
        height: 12px;
        stroke: currentColor;
        fill: none;
      }
      .badge--cat {
        color: var(--rd-accent);
        border-color: color-mix(in oklab, var(--rd-accent) 45%, var(--rd-border));
      }
      .badge--vol {
        color: var(--rd-fg);
        background: var(--rd-card-active);
        border-color: color-mix(in oklab, var(--rd-accent) 35%, var(--rd-border));
      }

      /* ---- SEARCH (row 1, right; with clear ✕) ---- */
      .search {
        flex: none;
        position: relative;
        height: var(--ctl-h);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 9px;
        width: 248px;
        border: 1px solid var(--rd-border);
        border-radius: var(--radius-control);
        background: var(--rd-field-bg);
      }
      .search svg.glass {
        width: 15px;
        height: 15px;
        stroke: var(--rd-muted);
        fill: none;
        flex: none;
      }
      .search input {
        direction: rtl;
        text-align: right;
        background: none;
        border: 0;
        outline: 0;
        color: var(--rd-fg);
        font-family: var(--ar-body);
        font-size: 16px;
        width: 100%;
      }
      .search input::placeholder {
        color: var(--rd-muted);
      }
      .search .clear {
        display: none;
        flex: none;
        width: 18px;
        height: 18px;
        border: 0;
        border-radius: 50%;
        background: var(--rd-pill-bg);
        color: var(--rd-fg);
        font-size: 12px;
        cursor: pointer;
      }
      .search.has-text .clear {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* pager */
      .page-pill {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        height: var(--ctl-h);
        padding: 0 14px;
        border-radius: var(--radius-control);
        border: 1px solid var(--rd-accent);
        background: var(--rd-card-active);
        color: var(--rd-fg);
        font-size: 13px;
      }
      .page-pill .total {
        color: var(--rd-muted);
        font-size: 11px;
      }
      .iconbtn {
        width: var(--ctl-h);
        height: var(--ctl-h);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--rd-border);
        border-radius: var(--radius-control);
        background: var(--rd-pill-bg);
        color: var(--rd-fg);
        font-size: 15px;
        cursor: pointer;
      }
      .iconbtn:hover {
        border-color: var(--rd-accent);
      }

      /* ---- BODY ---- */
      .body {
        flex: 1 1 auto;
        display: flex;
        min-height: 0;
      }
      .drawer {
        flex: none;
        width: 270px;
        border-right: 1px solid var(--rd-border);
        background: color-mix(in oklab, var(--rd-toolbar-bg) 60%, var(--rd-bg));
        overflow-y: auto;
        padding: 16px 14px;
      }
      .drawer[hidden] {
        display: none;
      }
      .drawer h3 {
        font-family: var(--en);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--rd-muted);
        margin: 0 0 12px;
      }
      .toc-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 8px;
        padding: 9px 10px;
        border-radius: 6px;
        cursor: pointer;
        color: var(--rd-fg);
      }
      .toc-item .t {
        font-family: var(--ar-body);
        font-size: 16px;
        direction: rtl;
        grid-column: 1;
      }
      .toc-item .p {
        font-family: var(--en);
        font-size: 12px;
        color: var(--rd-muted);
        grid-column: 2;
        grid-row: 1;
        align-self: start;
      }
      .toc-item .te {
        font-family: var(--en);
        font-size: 12px;
        color: var(--rd-muted);
        grid-column: 1;
      }
      .toc-item:hover {
        background: var(--rd-card);
      }
      .toc-item.active {
        background: var(--rd-card-active);
        box-shadow: inset 2px 0 0 var(--rd-accent);
      }
      .match {
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      .match:hover {
        background: var(--rd-card);
      }
      .match .pg {
        font-family: var(--en);
        font-size: 11px;
        color: var(--rd-accent);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .match .snip {
        font-family: var(--ar-body);
        font-size: 15px;
        direction: rtl;
        color: var(--rd-fg);
        margin-top: 3px;
      }
      mark {
        background: var(--rd-match);
        color: inherit;
        border-radius: 2px;
        padding: 0 1px;
      }

      .main {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 30px 40px 90px;
      }

      /* page-head — modeled on your example */
      .pagehead {
        text-align: center;
        max-width: 820px;
        margin: 0 auto 26px;
      }
      .pagehead .eyebrow {
        font-family: var(--en);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--rd-muted);
      }
      .pagehead .chapter {
        font-family: var(--ar-display);
        font-weight: 700;
        font-size: 1.85em;
        direction: rtl;
        color: var(--rd-fg);
        margin: 14px 0 0;
      }
      .pagehead .bab {
        font-family: var(--ar-display);
        font-size: 1.25em;
        direction: rtl;
        color: var(--rd-accent);
        margin: 8px 0 0;
      }
      .pagehead .chapter-en {
        font-family: var(--ar-display);
        font-style: italic;
        font-size: 0.95em;
        color: var(--rd-muted);
        margin: 12px 0 0;
      }
      .pagehead .rule {
        width: 100%;
        height: 1px;
        background: var(--rd-rule);
        margin: 22px 0 0;
      }
      .article {
        max-width: 880px;
        margin: 0 auto;
      }

      /* bilingual prose split (English left, Arabic right) */
      .para-row {
        display: grid;
        gap: 26px;
        margin: 0 0 22px;
      }
      [data-lang='both'] .para-row {
        grid-template-columns: 1fr 1fr;
      }
      .prose-en {
        font-family: var(--en);
        font-size: 0.96em;
        line-height: 1.78;
        text-align: justify;
        color: var(--rd-fg);
      }
      .prose-ar {
        font-family: var(--ar-body);
        font-size: 1.2em;
        line-height: 2.05;
        direction: rtl;
        text-align: justify;
        color: var(--rd-fg);
      }
      .draft-tag {
        display: inline-block;
        font-family: var(--en);
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--rd-muted);
        border: 1px dashed var(--rd-border);
        border-radius: 4px;
        padding: 1px 6px;
        margin-bottom: 8px;
      }

      /* hadith unit */
      .hadith {
        border: 1px solid var(--rd-border);
        border-radius: 14px;
        background: var(--rd-card);
        padding: 22px 24px;
      }
      .hadith__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .hadith__id {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .hnum {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid var(--rd-accent);
        color: var(--rd-accent);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--ar-display);
        font-size: 16px;
      }
      .hadith__meta {
        font-family: var(--en);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--rd-muted);
      }
      .grade {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 23px;
        padding: 0 11px;
        border-radius: 999px;
        font-family: var(--ar-body);
        font-size: 14px;
        color: #2c7a4b;
        background: color-mix(in oklab, #2f9e5e 20%, transparent);
        border: 1px solid color-mix(in oklab, #2f9e5e 42%, transparent);
        direction: rtl;
      }
      [data-theme='dark'] .grade {
        color: #7bd6a0;
      }
      .grade .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .isnad {
        font-family: var(--ar-body);
        font-size: 1.08em;
        line-height: 1.95;
        direction: rtl;
        text-align: justify;
        color: var(--rd-accent);
        margin: 0 0 4px;
      }
      .isnad .narr {
        color: var(--rd-accent);
        border-bottom: 1px dotted var(--rd-accent);
        cursor: pointer;
        font-weight: 600;
      }
      .hadith__div {
        height: 1px;
        background: var(--rd-rule);
        margin: 16px 0;
      }
      .matn-grid {
        display: grid;
        gap: 26px;
      }
      [data-lang='both'] .matn-grid {
        grid-template-columns: 1fr 1fr;
      }
      .parallels {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--rd-rule);
      }
      .parallels .lbl {
        font-family: var(--en);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--rd-muted);
      }
      .xref {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid var(--rd-border);
        background: var(--rd-card-active);
        font-family: var(--ar-body);
        font-size: 14px;
        direction: rtl;
        color: var(--rd-fg);
      }
      .xref .xpg {
        font-family: var(--en);
        font-size: 11px;
        color: var(--rd-muted);
      }

      /* isnad panel (right) — tree, modeled on your example */
      .panel {
        flex: none;
        width: 320px;
        border-left: 1px solid var(--rd-border);
        background: color-mix(in oklab, var(--rd-toolbar-bg) 60%, var(--rd-bg));
        overflow-y: auto;
        padding: 18px 18px;
      }
      .panel[hidden] {
        display: none;
      }
      .panel h3 {
        font-family: var(--en);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--rd-muted);
        margin: 0 0 4px;
      }
      .panel .sub {
        font-size: 12px;
        color: var(--rd-muted);
        margin-bottom: 16px;
      }
      .node {
        position: relative;
        display: grid;
        grid-template-columns: 30px 1fr auto;
        gap: 0 11px;
        padding: 0 0 20px;
      }

          paras: [
            {

              en: 'Praise be to God, who taught by the pen, and taught man what he did not know; and peace be upon him who was granted the most comprehensive of speech. To proceed: the science of grammar arose in Baṣra at the hands of al-Khalīl ibn Aḥmad and his pupil Sībawayh, and its terminology then developed generation after generation until it attained its full maturity with al-Zamakhsharī in his Mufaṣṣal.',
            },
            {

              { v: 'سُفيانُ', narr: true },

            matnEn:
              '“Actions are judged only by their intentions, and every person shall have only what he intended. So whoever emigrated for a worldly gain to be won or a woman to be married, his emigration was for that to which he emigrated.”',

              { ar: 'صحيح مسلم', pg: 'p. 1907' },

            narrators: [
              {
                nm: 'ʿUmar ibn al-Khaṭṭāb',
                ar: 'عُمر بن الخطّاب',
                rl: 'Companion · heard the Prophet ﷺ',
                gr: 'Companion',
                origin: true,
              },
              {
                nm: 'ʿAlqama ibn Waqqāṣ al-Laythī',
                ar: 'علقمة بن وقّاص',
                rl: 'd. 80 AH · Successor',
                gr: 'Trustworthy',
              },
              {
                nm: 'Muḥammad ibn Ibrāhīm al-Taymī',
                ar: 'محمد بن إبراهيم',
                rl: 'd. 120 AH · Transmitter',
                gr: 'Trustworthy',
              },
              {
                nm: 'Yaḥyā ibn Saʿīd al-Anṣārī',
                ar: 'يحيى بن سعيد',
                rl: 'd. 143 AH · Transmitter',
                gr: 'Eminent',
              },
              {
                nm: 'Sufyān ibn ʿUyayna',
                ar: 'سفيان بن عيينة',
                rl: 'd. 198 AH · Ḥāfiẓ',
                gr: 'Eminent',
              },
              {
                nm: 'al-Ḥumaydī ʿAbd Allāh ibn al-Zubayr',

                rl: 'd. 219 AH · al-Bukhārī’s teacher',

      const SIZE = { min: 16, max: 26, step: 1 };
      const state = {
        book: 'grammar',
        masthead: 'editorial',
        theme: 'classical',
        lang: 'both',
        size: 19,
        page: 1,
        contents: true,
        isnad: false,
        search: '',
      };
      const root = document.getElementById('root');
      const esc = (s) =>
        s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

      function metaBadges() {
        const b = BOOKS[state.book];
        const out = [
          `<span class="badge badge--cat"><svg viewBox="0 0 24 24" stroke-width="1.7"><path d="M4 7h16M4 12h16M4 17h10"/></svg>${esc(b.category)}</span>`,
        ];
        if (b.deathAh) out.push(`<span class="badge">d. ${b.deathAh} AH</span>`);
        if (b.volumeCount > 1)
          out.push(
            `<span class="badge badge--vol"><svg viewBox="0 0 24 24" stroke-width="1.7"><path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M9 4v16"/></svg>Volume ${b.volume} of ${b.volumeCount}</span>`,
          );
        return `<span class="badges">${out.join('')}</span>`;
      }

      function renderMasthead() {
        const b = BOOKS[state.book];
        document.getElementById('masthead').innerHTML = `
          <div class="mh-title">
            <span class="mh-ar">${esc(b.titleAr)}</span>
            <span class="mh-sep">·</span>
            <span class="mh-rom">${esc(b.romanized)} · ${esc(b.authorRom)}</span>
          </div>
          ${metaBadges()}`;
        document.getElementById('heroBand').innerHTML = `
          <div class="hero-ar">${esc(b.titleAr)}</div>
          <div class="hero-en">${esc(b.romanized)}</div>
          <div class="hero-author">${esc(b.authorAr)}</div>
          <div class="hero-badges">${metaBadges()}</div>`;
      }

      function highlight(text) {
        const q = state.search.trim();
        if (q.length < 2) return esc(text);
        return esc(text).replace(
          new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'g'),
          '<mark>$1</mark>',
        );
      }

      function renderDrawer() {
        const drawer = document.getElementById('drawer');
        const b = BOOKS[state.book];
        const q = state.search.trim();
        if (q.length >= 2) {
          drawer.hidden = false;
          const hay = b.hadith ? b.hadith.matnAr : b.paras[0].ar;
          const hit = hay.includes(q);
          drawer.innerHTML =
            `<h3>Results · “${esc(q)}”</h3>` +
            (hit
              ? `<div class="match"><div class="pg">Page ${state.page}</div><div class="snip">${highlight(hay.slice(0, 96))}…</div></div>`
              : `<div class="match"><div class="pg" style="color:var(--rd-muted)">No match on this page</div><div class="snip" style="font-family:var(--en);font-size:13px">Search runs across the whole book in the app.</div></div>`);
          return;
        }
        if (!state.contents) {
          drawer.hidden = true;
          return;
        }
        drawer.hidden = false;
        drawer.innerHTML =
          `<h3>Contents</h3>` +
          b.toc
            .map(
              (e) =>
                `<div class="toc-item ${e.p === 1 ? 'active' : ''}"><span class="t">${esc(e.t)}</span><span class="p">${e.p}</span><span class="te">${esc(e.te)}</span></div>`,
            )
            .join('');
      }

      function pageHead(b) {
        return `
          <div class="pagehead">
            <div class="eyebrow">Page ${state.page} of ${b.totalPages} · ${esc(b.chapterEn.split(' · ')[0])}</div>
            <div class="chapter">${esc(b.chapterAr)}</div>
            <div class="bab">${esc(b.babAr)}</div>
            <div class="chapter-en">${esc(b.chapterEn)}</div>
            <div class="rule"></div>
          </div>`;
      }

      function renderMain() {
        const b = BOOKS[state.book];
        const main = document.getElementById('main');

        if (!b.hadith) {
          // continuous bilingual prose
          const draft =
            b.draft && state.lang !== 'ar'
              ? `<span class="draft-tag">Sample translation</span>`
              : '';
          const rows = b.paras
            .map((p) => {
              const en =
                state.lang !== 'ar' ? `<div class="prose-en">${highlight(p.en)}</div>` : '';
              const ar =
                state.lang !== 'en' ? `<div class="prose-ar">${highlight(p.ar)}</div>` : '';
              return `<div class="para-row">${en}${ar}</div>`;
            })
            .join('');
          main.innerHTML = `<article class="article">${pageHead(b)}${draft}${rows}</article>`;
          return;
        }

        // hadith
        const h = b.hadith;
        const isnad =
          state.lang !== 'en'
            ? `<p class="isnad" dir="rtl">${h.isnadSegs
                .map((s) => (s.narr ? `<span class="narr">${esc(s.v)}</span>` : esc(s.v)))
                .join('')}</p><div class="hadith__div"></div>`
            : '';
        const en = state.lang !== 'ar' ? `<div class="prose-en">${highlight(h.matnEn)}</div>` : '';
        const ar = state.lang !== 'en' ? `<div class="prose-ar">${highlight(h.matnAr)}</div>` : '';
        const parallels = h.parallels
          .map((x) => `<span class="xref">${esc(x.ar)}<span class="xpg">${esc(x.pg)}</span></span>`)
          .join('');
        main.innerHTML = `
          <article class="article">
            ${pageHead(b)}
            <section class="hadith">
              <header class="hadith__head">
                <span class="hadith__id">
                  <span class="hnum">١</span>
                  <span class="hadith__meta">Hadith ${h.n} · ${h.narrators.length} narrators</span>
                </span>
                <span class="grade"><span class="dot"></span>${esc(h.grade)}</span>
              </header>
              ${isnad}
              <div class="matn-grid">${en}${ar}</div>
              <div class="parallels"><span class="lbl">Parallels</span>${parallels}</div>
            </section>
          </article>`;
      }

      function renderPanel() {
        const panel = document.getElementById('panel');
        const b = BOOKS[state.book];
        if (!state.isnad) {
          panel.hidden = true;
          return;
        }
        panel.hidden = false;
        if (!b.hadith) {
          panel.innerHTML = `<h3>Isnād · transmission chain</h3><div class="sub">No isnād for a continuous-prose work. Switch to the multi-volume hadith book for a live chain.</div>`;
          return;
        }
        const h = b.hadith;
        panel.innerHTML =
          `<h3>Isnād · transmission chain</h3><div class="sub">Hadith ${h.n} · ${h.narrators.length} narrators · ${esc(h.grade)}</div>` +
          h.narrators
            .map(
              (n, i) =>
                `<div class="node">
                  <span class="node__badge ${n.origin ? 'origin' : ''}">${n.origin ? '★' : i}</span>
                  <span class="node__nm">${esc(n.nm)}<div class="node__rl">${esc(n.rl)}</div><span class="gradechip">${esc(n.gr)}</span></span>
                  <span class="node__ar">${esc(n.ar)}</span>
                </div>`,
            )
            .join('');
      }

        root.dataset.theme = state.theme;
        root.dataset.lang = state.lang;
        root.dataset.masthead = state.masthead;

        document.getElementById('sizeVal').textContent = state.size + 'px';
        document.getElementById('pgNum').textContent = state.page;
        document.getElementById('pgTotal').textContent = BOOKS[state.book].totalPages;
        document.getElementById('isnadBtn').disabled = !BOOKS[state.book].hadith;
        document.getElementById('contentsBtn').setAttribute('aria-pressed', String(state.contents));
        document.getElementById('isnadBtn').setAttribute('aria-pressed', String(state.isnad));
        const press = (sel, key) =>
          document
            .querySelectorAll(sel)
            .forEach((x) => x.setAttribute('aria-pressed', String(x.dataset[key] === state[key])));
        press('#themeSeg button', 'theme');
        press('#langSeg button', 'lang');
        press('#bookSeg button', 'book');
        press('#mhSeg button', 'masthead');
        document.getElementById('search').classList.toggle('has-text', state.search.length > 0);
      }

      function renderAll() {
        syncControls();
        renderMasthead();
        renderDrawer();
        renderMain();
        renderPanel();
      }

      const on = (id, ev, fn) => document.getElementById(id).addEventListener(ev, fn);
      const segClick = (id, key, after) =>
        on(id, 'click', (e) => {
          const btn = e.target.closest('button');
          if (!btn) return;
          state[key] = btn.dataset[key];
          if (after) after();
          renderAll();
        });
      segClick('bookSeg', 'book', () => {
        state.page = 1;
        if (!BOOKS[state.book].hadith) state.isnad = false;
      });
      segClick('mhSeg', 'masthead');
      segClick('themeSeg', 'theme');
      segClick('langSeg', 'lang');
      on('contentsBtn', 'click', () => {
        state.contents = !state.contents;
        renderAll();
      });
      on('isnadBtn', 'click', () => {
        if (document.getElementById('isnadBtn').disabled) return;
        state.isnad = !state.isnad;
        renderAll();
      });
      on('sizeUp', 'click', () => {
        state.size = Math.min(SIZE.max, state.size + SIZE.step);
        renderAll();
      });
      on('sizeDown', 'click', () => {
        state.size = Math.max(SIZE.min, state.size - SIZE.step);
        renderAll();
      });
      const pg = (d) => {
        state.page = Math.max(1, Math.min(BOOKS[state.book].totalPages, state.page + d));
        renderAll();
      };
      on('pgPrev', 'click', () => pg(-1));
      on('pgNext', 'click', () => pg(1));
      on('pgBack10', 'click', () => pg(-10));
      on('pgFwd10', 'click', () => pg(10));
      on('searchInput', 'input', (e) => {
        state.search = e.target.value;
        renderAll();
      });
      on('searchClear', 'click', () => {
        state.search = '';
        document.getElementById('searchInput').value = '';
        renderAll();
      });
      on('main', 'click', (e) => {
        if (e.target.closest('.narr')) {
          state.isnad = true;
          renderAll();
        }
      });

      renderAll();
    </script>
  </body>
</html>
