# Declarative policy registry: one entry per enforcing handler under
# .claude/lib/handlers/. The Python handlers are the source of truth for
# enforcement; this file is the reviewable contract, and docs/ is generated from
# it plus the handler DOC anchors (see .claude/lib/gen_standards_docs.py). The
# self-test .claude/tests/test_quality_policy.py enforces that every write-chain
# handler has an entry here, so the mirror cannot silently drift.

version: 1

rules:
  # ---- Design system (SSOT/DRY) ----------------------------------------------
  - id: DS-001
    handler: no_raw_colors
    severity: block
    summary: Raw color literals (#hex, rgb, oklch...) only in tokens.css.
    rationale: Single source of truth for color. Theme retuning must be one edit.
    doc: docs/design-system.md#hard-rules

  - id: DS-002
    handler: no_inline_styles
    severity: block
    summary: No inline style props in React .tsx and .jsx files.
    rationale: Inline styles bypass the design system and twMerge.
    doc: docs/design-system.md#hard-rules

  - id: DS-003
    handler: primitive_usage
    severity: block
    summary: Routes must use design-system primitives, not raw HTML elements.
    rationale: Raw <button>/<input> drift from the rest of the app.
    doc: docs/design-system.md#hard-rules

  - id: DS-004
    handler: variants_only
    severity: block
    summary: Status → palette maps live only in variants.ts.
    rationale: Vocabulary spread across files breaks rebrandability.
    doc: docs/design-system.md#hard-rules

  - id: DS-005
    handler: no_arbitrary_values
    severity: block
    summary: >
      Tailwind arbitrary values for the spacing / sizing / type scales
      (text-[14px], p-[7px], w-[200px]) are blocked; only values that resolve to
      a token (bg-[var(--color-x)]) pass.
    rationale: no_raw_colors covers color; this closes the same SSOT hole for the spacing and type scales.
    doc: docs/design-system.md#hard-rules

  # ---- Boundaries ------------------------------------------------------------
  - id: BND-001
    handler: import_boundaries
    severity: block
    summary: $lib/design-system/internal is private.
    rationale: Encapsulation — only the design system itself uses internal/.
    doc: docs/quality-standards.md#imports--boundaries

  - id: BND-002
    handler: import_boundaries
    severity: block
    summary: Frontend may not import backend / pipeline Python packages.
    rationale: Frontend talks to backend over HTTP, not in-process.
    doc: docs/quality-standards.md#imports--boundaries

  # ---- Code quality ----------------------------------------------------------
  - id: QUAL-010
    handler: file_size_cap
    severity: advisory
    summary: >
      File LOC signal at 400, advisory only. A large file calls for extracting
      a real concept, never a mechanical split into facade plus shards.
    doc: docs/quality-standards.md#size-caps

  - id: QUAL-011
    handler: function_size_cap
    severity: advisory
    summary: >
      Function LOC signal at 80, advisory only. A long function calls for a
      named extraction, never carving at an arbitrary line.
    doc: docs/quality-standards.md#size-caps

  - id: QUAL-012
    handler: no_silent_except
    severity: block
    summary: 'No bare `except:` or `except: pass`.'
    doc: docs/quality-standards.md#code-quality

  - id: QUAL-013
    handler: no_print
    severity: block
    summary: >
      print() is blocked in production Python (src/backend, src/pipeline); log via
      structlog. scripts/, tests/, .claude/, and __main__ modules are exempt.
    rationale: print bypasses the structured-logging contract — no level, no context, invisible to log shipping.
    doc: docs/quality-standards.md#code-quality

  - id: QUAL-014
    handler: magic_numbers
    severity: advisory
    summary: Magic numeric literals in production Python code.
    doc: docs/quality-standards.md#code-quality

  # ---- SSOT / DRY (strict — these block) -------------------------------------
  - id: SSOT-001
    handler: constant_sprawl
    severity: block
    summary: |
      Module-level constants live in exactly one file. Name re-declarations,
      value re-aliasing, and a re-enumerated string vocabulary (4+ members,
      seen through a helper wrapper like _norm_set/frozenset and past a private
      name) across files are all blocked.
    rationale: |
      "If a constant doesn't exist is the only time you can create one."
      TIMEOUT=30 in two modules diverges silently when one gets re-tuned. The
      same Arabic particle set typed in two files (authority._LINKS vs
      name_registry.LINKS) is the same divergence risk, so the string-set check
      catches derived, private duplicates the literal check cannot see.
    doc: docs/quality-standards.md#ssot-dry

  - id: DRY-001
    handler: function_duplication
    severity: block
    summary: |
      Public module-level functions are defined in exactly one file under
      src/. Re-defining the same name elsewhere is blocked.
    rationale: |
      Two `normalize_arabic` in two modules drift; callers pick one or the
      other and the behaviours diverge.
    doc: docs/quality-standards.md#ssot-dry

  - id: DRY-002
    handler: class_duplication
    severity: block
    summary: |
      Public module-level classes are defined in exactly one file under
      src/. Covers DTOs, schemas, enums, exceptions, TypedDict, NamedTuple.
    rationale: |
      Two `Book` Pydantic models in two modules diverge silently; two
      `ValidationError` exceptions catch each other's instances by
      accident.
    doc: docs/quality-standards.md#ssot-dry

  # ---- Centralization (sub-rules live in centralization.yaml) ---------------
  - id: CENTRAL-001-env
    handler: centralization
    severity: block
    summary: os.getenv / os.environ reads only in settings modules.
    doc: docs/quality-standards.md#ssot-dry

  - id: CENTRAL-002-regex
    handler: centralization
    severity: block
    summary: re.compile / re.search / etc. only in patterns modules.
    doc: docs/quality-standards.md#ssot-dry

  - id: CENTRAL-003-http-status
    handler: centralization
    severity: block
    summary: HTTP status codes must be named, not bare integers.
    doc: docs/quality-standards.md#ssot-dry

  - id: CENTRAL-004-routes
    handler: centralization
    severity: block
    summary: HTTP route decorators only in src/backend/api/ modules.
    doc: docs/quality-standards.md#ssot-dry

  - id: CENTRAL-005-sql
    handler: centralization
    severity: block
    summary: Raw SQL strings only in repositories / migrations.
    doc: docs/quality-standards.md#ssot-dry

  # ---- Build / infra ---------------------------------------------------------
  - id: BUILD-001
    handler: single_pyproject
    severity: block
    summary: |
      pyproject.toml / package.json / lockfiles live at the repo root only;
      Docker files at root or under deploy/.
    rationale: |
      Two manifests split the dep graph — upgrades to one don't reach the
      other and behaviours drift.
    doc: docs/quality-standards.md#ssot-dry

  - id: FAILFAST-001
    handler: fail_loud
    severity: block
    summary: |
      Silent fallbacks inside `except` blocked: `return None|[]|{}|"UNKNOWN"`,
      bare `continue`, or `pass`-only body — unless logging / raise precedes.
    rationale: |
      "Wrong is worse than absent." A swallowed exception that returns None
      looks identical to a normal-empty None. The caller must be able to
      tell a failure from data.
    doc: docs/quality-standards.md#fail-fast

  - id: FAILFAST-002
    handler: no_fallback
    severity: block
    summary: |
      The strict sibling of fail_loud: the word `fallback` / `fall back`, a
      Python `except` with no `raise`, and a JS/TS `catch` with no `throw` are
      blocked in src/ and scripts/.
    rationale: |
      fail_loud permits "log then return None"; no_fallback rejects any
      error-recovery that lets the program continue without telling the caller
      something failed. Absence must be modelled explicitly, not synthesised in a
      handler.
    doc: docs/quality-standards.md#fail-fast

  # ---- Durability (no patchwork) ---------------------------------------------
  - id: PATCH-001
    handler: no_patchwork
    severity: block
    summary: |
      Self-admitted patchwork vocabulary in src/ and frontend/src/ is blocked:
      band-aid, stopgap, kludge, duct-tape, patchwork, patch-job, quick-fix,
      quick-and-dirty, hacky, "good enough for now".
    rationale: |
      A word that admits a corner-cut names a non-durable fix. Resolve the root
      cause and delete what it replaces; when filtering domain data, encode the
      structural or grammatical rule that decides membership, never an
      enumeration of bad examples grown one bug at a time. This is the mechanical
      floor: the push-time AI review (scripts/cca_review.sh) and the CLAUDE.md
      durability directive catch the reactive-blocklist form a regex cannot.
    doc: docs/quality-standards.md#no-patchwork

  # ---- Python typing ---------------------------------------------------------
  - id: PY-001
    handler: typed_python
    severity: block
    summary: Public Python functions need return-type annotations.
    doc: docs/quality-standards.md#code-quality

  # ---- Helper functions ------------------------------------------------------
  - id: FUNC-001
    handler: helper_constraints
    severity: block
    summary: >
      Function names must say what they do: vague names (helper, process,
      handle), multi-responsibility names (_and_ / _then_ / _or_), and names
      longer than 40 characters are blocked.
    rationale: A name that hides the responsibility, or bundles several, is a single-responsibility smell.
    doc: docs/quality-standards.md#helper-functions

  - id: FUNC-002
    handler: helper_constraints
    severity: advisory
    summary: >
      More than 5 parameters (excluding self / cls) is an advisory design smell,
      not a block.
    rationale: >
      Hard-blocking the count manufactured transfer dataclasses whose only job
      was to smuggle the same arguments past the gate, which is worse than a wide
      signature; the author must weigh it instead.
    doc: docs/quality-standards.md#helper-functions

  # ---- Docstrings & comments -------------------------------------------------
  - id: DOC-010
    handler: docstring_required
    severity: block
    summary: >
      Every public function and class needs a docstring. tests/ and __init__.py
      are skipped; @overload stubs are exempt.
    rationale: The public surface documents intent at the point of use.
    doc: docs/quality-standards.md#docstrings

  - id: DOC-011
    handler: no_inline_comments
    severity: block
    summary: >
      Code comments, both inline and standalone, are blocked; intent belongs in
      docstrings and names. Tooling directives (# type:, # noqa, ...), the
      shebang, section dividers, and unicode-escape annotation lines are exempt.
    rationale: Comments drift out of sync with the code they describe; docstrings and names do not.
    doc: docs/quality-standards.md#comments

  # ---- UI centralization -----------------------------------------------------
  - id: UI-001
    handler: css_duplication
    severity: block
    summary: >
      An identical CSS selector body defined in two files under frontend/src is
      blocked; each selector is defined once.
    rationale: One CSS file per primitive/component; a selector copied into two files drifts silently.
    doc: docs/quality-standards.md#ui-centralization

  # ---- Tests -----------------------------------------------------------------
  - id: TEST-001
    handler: test_naming
    severity: block
    summary: Test names follow test_should_<verb>_<object>_<condition>.
    doc: docs/quality-standards.md#tests

  # ---- Security --------------------------------------------------------------
  - id: SEC-001
    handler: secret_scanner
    severity: block
    summary: High-confidence secret patterns blocked at write time.
    doc: docs/quality-standards.md#security

  # ---- Bash safety net -------------------------------------------------------
  - id: BASH-001
    handler: dangerous_bash
    severity: block
    summary: rm -rf at root.
  - id: BASH-002
    handler: dangerous_bash
    severity: block
    summary: git push --force to main/master.
  - id: BASH-003
    handler: dangerous_bash
    severity: block
    summary: git commit/push --no-verify.
  - id: BASH-004
    handler: dangerous_bash
    severity: block
    summary: curl | sh.
  - id: BASH-005
    handler: dangerous_bash
    severity: block
    summary: git reset --hard.

  # ---- Standalone isolation --------------------------------------------------
  - id: ISO-001
    handler: external_refs
    severity: block
    summary: No references to sibling or internal projects (the sol-* family plus a gitignored local deny-list).
    doc: docs/foundation.md#standalone-contract

  # ---- Documentation discipline ---------------------------------------------
  - id: DOC-001
    handler: docs_location
    severity: block
    summary: Markdown docs live in docs/ (except root README.md, CLAUDE.md).
    doc: docs/repo-layout.md#documentation
