<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A knowledge-graph reader for classical Arabic manuscripts: hadith, tafsīr, rijāl, and the Qurʾān, read Arabic-first with English alongside."
    />
    <!-- theme-color per scheme: matches tokens.css --color-bg / dark --palette-night-900 -->
    <meta name="theme-color" content="#ebe7da" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100d08" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Scheherazade+New:wght@400;500;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>SOL · Shia Online Library</title>
    <script>
      /* Pre-paint theme: applied before the bundle loads so a dark visitor
         never flashes light. Mirrors THEME.* in src/lib/constants.ts. */
      if (localStorage.getItem('sol-theme') === 'dark')
        document.documentElement.setAttribute('data-theme', 'dark');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
