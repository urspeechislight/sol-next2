name: ci

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: install node deps
        # `--frozen-lockfile` is enforced once `pnpm-lock.yaml` is committed;
        # skip the flag automatically on the very first CI run.
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
      - name: sync python deps
        run: uv sync --group dev
      - name: ci
        # Single source of truth: the same `pnpm run ci` that gates locally,
        # which runs format:check, py:check, py:test, harness:test, repo:audit,
        # fe:test, and fe:build. Delegating to the one script keeps this
        # workflow and the gate from drifting apart.
        run: pnpm run ci
