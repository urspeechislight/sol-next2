  alignment_confidence_min: 0.90
  semantic_similarity_min: 0.75
  dominance_gap_min: 0.15
  frontmatter_page_max: 5
  content_page_min_chars: 100
  content_min_line_length: 55
  min_span_chars: 20
  narrative_heading_max_chars: 300
  gold_set_precision_min: 0.85
  heading_split_max_heading_chars: 150
  isnad_chain_proximity_max: 40
  isnad_chain_gap_max: 85
  narrator_name_max_chars: 100
  question_verb_lookback_chars: 60
  rijal_name_similarity_min: 0.70
  rijal_search_k: 10
  rijal_entry_number_max: 99999
  rijal_classify_isnad_min_chars: 60
  rijal_classify_long_min_chars: 80
  quran_verse_max_chars: 500
  isnad_tail_max_chars: 120
  isnad_merge_name_max_chars: 60
  heading_split_min_heading_chars: 8
  tawatur_min_chains: 10
  istifadah_min_chains: 5
  aziz_min_chains: 2
  chain_generation_overlap_max: 50
  corroboration_matn_similarity_min: 0.80
  biography_year_search_window: 60
  biography_name_min_chars: 3
  biography_clitic_strip_min_word_chars: 5
  ner_person_confidence: 0.7
  rijal_teacher_ref_window: 80
  ruvector_timeout_seconds: 30
  evidence_context_chars: 50
  max_degraded_modes: 3
  quran_corpus_min_words: 4
  quran_corpus_min_match_chars: 20
  quran_corpus_high_coverage_min: 0.30
  dedup_exact_merge_min: 0.60
  dedup_fuzzy_merge_min: 0.75
  dedup_tarajm_link_min: 0.70
  dedup_death_year_tolerance: 5
  dedup_death_year_close: 2
  dedup_name_prefix_min_chars: 8
  dedup_token_overlap_min: 2
  dedup_max_block_size: 500
  dedup_embedding_sim_min: 0.70
  dedup_name_only_min_tokens: 3
  dedup_max_cluster_size: 50
  dedup_min_name_chars: 6
  registry_name_score_min: 0.70
  registry_score_gap_min: 0.15
  age_at_event_min: 10
  age_at_event_max: 130
  rijal_quality_lifespan_min: 10
  rijal_quality_lifespan_max: 130
  rijal_quality_hijri_year_max: 1500
  rijal_quality_age_year_tolerance: 15
  rijal_century_inference_window: 20
  rijal_century_inference_min_neighbors: 3
  rijal_century_inference_max_spread: 100


# ─────────────────────────────────────────────────────────────────────────────
# TOC SECTIONS
# Content-boundary detection: which existing patterns identify the start of
# main content in TOC entry titles. Phase 2 tests each TOC title against
# these patterns (in order). The first match marks the content-start page.
# All pages before that page get behavior EDITORIAL_FRONTMATTER.
# ─────────────────────────────────────────────────────────────────────────────
toc_sections:
  # Patterns tested against TOC entry titles, in order. The first TOC entry
  # whose cleaned title matches ANY pattern marks the page where main content
  # begins; pages before that are EDITORIAL_FRONTMATTER. Lower-priority
  # patterns help catch books whose first real chapter title doesn't contain
  # a classical heading keyword — e.g. modern sīrah works that use ``* X :``
  # subsection markers as the primary structural unit.
  content_start_patterns: [HEADING_MARKER, SUBSECTION_MARKER]


# ─────────────────────────────────────────────────────────────────────────────
# FAILURE BUDGET
# The operational form of CLAUDE.md's "fail loudly" — a hard halt threshold
# for silent fallbacks. When the share of content spans that fall through to
# GENERAL_PROSE WITHOUT matching any explicit routing rule exceeds this
# percentage, Phase 2 raises SegmentError. This catches the failure mode the
# council identified: a routing taxonomy that has silently stopped modelling
# its corpus, producing structurally valid garbage. Tightening this number is
# how we ratchet quality up; loosening it should require a written justification.
# ─────────────────────────────────────────────────────────────────────────────
failure_budget:
  # Initial ceiling chosen just above the highest currently-observed drift
  # post-TOC track (sira at ~16.6%). The number is a ratchet — every PR
  # that adds a behavior rule for an observed pattern combo should lower
  # this. Target milestones: 15% (post-routing-coverage pass), 10%
  # (post-HISTORICAL_NARRATIVE expansion), 5% (production target). The
  # intent is for this value to fall over time, not rise; raising it
  # requires written justification in PR.
  unclassified_routed_max_pct: 20.0
  min_content_spans_for_enforcement: 20


# ─────────────────────────────────────────────────────────────────────────────
# CROSS-PAGE REPAIR
# Tokens that signal a compound Arabic name has been line-broken across pages.
# When the previous page's last token matches one of these, Phase 2 joins the
# pages with a space instead of a newline so the boundary splitter cannot
# fire on the page seam — preventing names like عبد المطلب / أبو القاسم /
# ابن الأثير from being torn apart and their tails mislabeled as headings.
# ─────────────────────────────────────────────────────────────────────────────
stance_extraction:
  # The council's Phase C — STANCE edges (PERSON → PERSON/EVENT/GROUP with
  # valence). LLM-only, semantic, not deterministic. Ship dark behind this
  # flag until two promotion gates are met:
  #   1. Gold-set inter-annotator agreement on stance assertions ≥ 0.70
  #      across at least 200 hand-labeled spans (see data/gold_set/).
  #   2. Every STANCE edge carries a complete asserter chain back to either
  #      a deterministic CITATION_REF entity or to the manuscript author.
  # Both gates are non-negotiable. STANCE edges produced without a complete
  # asserter chain are blocked by Edge's __post_init__ in src/models/.
  enabled: false
  promotion_inter_annotator_agreement_min: 0.70
  promotion_gold_set_min_spans: 200
  edge_type: STANCE
  allowed_valences: [hostile, friendly, neutral, allied, betrayed, pledged]


narrative_genres:
  # book_types where the modern-authorial-narrative routing applies. Used by
  # Phase 2 to gate the HEADING_MARKER / FIQH_RULING drop for long spans
  # carrying narrative evidence (classical-source attribution, hijri date,
  # lunar month). Fiqh and hadith book_types are intentionally NOT here:
  # a fiqh manual that mentions a date in a ruling should keep its FIQH
  # label, not get reclassified as narrative.
  book_types:
    - prophet-imams-biography
    - genealogy-biography
    - history-geography


cross_page_repair:
  name_prefix_tokens:
    - عبد
    - أمة
    - عبيد
    - أبو
    - أبي
    - أم
    - ابن
    - بن
    - بنت
    - أهل
    - بني
    - آل
    - ذو
    - ذي


# ─────────────────────────────────────────────────────────────────────────────
# NARRATOR EXTRACTION
# Domain-specific settings for hadith narrator extraction in Phase 3.
# ─────────────────────────────────────────────────────────────────────────────
narrator_extraction:
  relative_references:
    - "أبيه"
    - "أبوه"
    - "أمه"
    - "أمها"
    - "جده"
    - "جدته"
    - "عمه"
    - "عمته"
    - "أخيه"
    - "أخته"
    - "خاله"
    - "خالته"
    - "ابنه"
    - "ابنته"

  prepositional_an_exclusions:
    - "يمين"
    - "شمال"
    - "يسار"
    - "رأس"
    - "ظهر"
    - "جنب"
    - "وجه"
    - "فرس"
    - "سبيل"
    - "طريق"
    - "قلب"
    - "ذلك"
    - "هذا"
    - "هؤلاء"
    - "المدينة"
    - "الدنيا"
    - "الآخرة"
    - "نفسه"
    - "نفسها"
    - "نفسي"

  narrative_context_words:
    - "في"
    - "ذلك"
    - "هذا"
    - "شيئ"

  # Words after أنا that indicate it is the pronoun "I" (أنا أسمع = I was
  # listening), not the transmission abbreviation أنا = أخبرنا.
  pronoun_ana_exclusions:
    - "أسمع"
    - "أعلم"
    - "أعرف"
    - "أكتب"
    - "أقرأ"
    - "أنظر"
    - "أحفظ"
    - "أحسب"
    - "قائم"
    - "حاضر"
    - "معه"
    - "معهم"
    - "معها"
    - "شاهد"

  # Words that are never standalone narrator names (pronouns, common words)
  narrator_stopwords:
    - "هو"
    - "هي"
    - "هم"
    - "هن"
    - "هكذا"
    - "غيرهم"
    - "الحديث"
    - "فتى"
    - "يقول"

  transmission_tail_verbs:
    - "يحدث"
    - "يروي"
    - "يخبر"

  name_content_boundaries:
    # Patterns that mark where a narrator name ends and content begins
    an_clause_not_transmission: "\\bأنه[ام]?\\s+(?!سمع|حدث|أخبر|روى|ثنا|نبأ)"
    book_abbreviation_ref: "\\b(?:يب|كا|ئل|فقيه)\\s+\\d"
    topical_fi: "\\bفي\\s+(?:حديث|كتاب|باب|قول|رواية|تفسير|سورة|يب|كا|ئل|مسجد|مكة|المدينة|نار|عصمت)"
    nahw_formula: "\\bنحو\\s+ما\\b"
    mithluhu: "\\bمثله\\b"
    editorial_reference: "\\bوقد\\s+أوردنا"
    question_mark: "[؟?]"
    qala_colon: "\\bقال\\s*:\\s*\\S"
    an_not_name: "\\b[اأإ]ن\\s+(?!يحيى|يزيد|يعقوب|يوسف|يونس)\\S+\\s"
    fa_narrative_verbs: "\\bف(?:هل|لم|لما|إذا|قام|جاء|أخذ|دخل|خرج|قال|سأل)\\b"
    thumma_inna: "\\bثم\\s+إن\\b"
    vocative: "\\bيا\\s+"
    colon_separator: "\\s+:\\s+"
    saqita: "\\bساقطة\\b"
    kanat_prophet: "\\bكانت?\\s+(?:رسول|النبي|تحت)"
    # Transmission method phrases (صيغ الأداء) — follow the narrator name,
    # never part of it.  E.g. "الصواف قراءة عليه وأنا أسمع قال"
    transmission_method: "(?:قراءة|قرئ|عرض(?:ت|نا)?|سماعا?)\\s+(?:عليه|عليها|علينا|عليهم|من\\b)"
    audition_witness: "وأنا أسمع"
    # Honorific formulas that follow a person's name, never part of it.
    honorific_salawat: "\\bصلى\\s+الله\\s+عليه"
    honorific_praise: "\\bرضي\\s+الله\\s+عنه"
    # Demonstrative + content noun: "هذا الحديث" (this hadith) is content, not a name.
    demonstrative_content: "(?:هذا|هذه|بهذا|بهذه|لهذا|لهذه)\\s+(?:الحديث|الخبر|الأثر|القول|الرواية|الكتاب|الباب)"
    honorific_mercy: "\\bرحم[ةه]\\s+الله\\b"
    # Cross-reference verbs with pronoun suffixes — "رواه البيهقي" (he narrated it)
    # is a reference to another scholar's collection, never a narrator name.
    cross_reference_verb: "\\bو?(?:رواه[ا]?|أخرجه[ا]?|ذكره[ا]?|هكذا)\\b"
    # Pronoun "he/she" at start of name_slice is always commentary, never a name.
    pronoun_sentence_start: "^\\s*ه[وي]\\s"
    # Present-tense transmission verbs after a narrator name end the name.
    # Includes pronominal suffix forms (يحدثك, يحدثه, يرويه, etc.)
    transmission_tail: "\\b(?:يحدث|يروي|يخبر|يذكر)(?:ه[امن]?|ك[مـ]?|نا|ون)?\\b"
    # "كان من / كانت من" — biographical phrase ("was from the companions of..."),
    # never part of a narrator name.
    kana_min: "\\bكان[ت]?\\s+من\\b"
    # Narrator grading vocabulary — "ثقة" (trustworthy), "ضعيف" (weak), etc.
    # These follow a name as evaluation, never part of it.
    grading_phrase: "\\b(?:ثقة|ضعيف|كذاب|قليل الحديث|كثير الحديث|مجهول)\\b"
    # "وهو/وهي" + descriptive verb/adjective — circumstantial clause describing
    # state, never part of a narrator name.
    waw_huwa_descriptive: "\\bوه[وي]\\s+(?:يصلي|ينظر|جالس|قائم|واقف|متكئ|راكب|نائم|قاعد|مضطجع|من\\s+مشا[يئ]خ|مستقبل)"
    # "الحديث" at the end of a name_slice (with optional ellipsis/dots) is a
    # cross-reference, not part of the narrator name.
    trailing_hadith: "\\.\\s*\\.?\\s*\\.?\\s*الحديث|\\bالحديث\\s*\\d|\\bالحديث\\s*$"
    # "قد تقدم" (has preceded) — editorial cross-reference phrase.
    qad_taqaddama: "\\bقد\\s+تقدم\\b"
    # "إنه/إنها" (indeed he/she) — introduces content clause, not a name.
    # Distinguished from أنه which has its own boundary with transmission lookahead.
    innahu_content: "\\b[إا]نه[ام]?\\s+(?!سمع|حدث|أخبر|روى)"
    # "لأنه/لأنها" (because he/she) — causal clause.
    li_annahu: "\\bلأنه[ام]?\\s"
    # "أنه سمع" mid-name merges two narrators — treat as boundary.
    # Distinct from an_clause_not_transmission which has a lookahead that
    # allows "أنه سمع" as transmission. When it appears inside a name_slice
    # (between two attribution verbs), it signals a narrator boundary.
    anahu_samiʿa: "\\bأنه[ام]?\\s+سمع"
    # Reference numbers: ") . 6243" or similar — editorial apparatus.
    reference_number: "[)\\]]\\s*\\.?\\s*[-–]|[)\\]]\\s*\\.?\\s*\\d{3,}"
    # Poetry marker: * between hemistiches (with surrounding whitespace).
    poetry_marker: "\\s\\*\\s"
    # "كما" (as / just as) — introduces comparison or attestation clause.
    kama_clause: "\\bكما\\s+(?:صرح|يظهر|ذكر|قال|روى|نقل|تقدم|في\\b)"
    # "باسناده إلى" (with his chain to) — transmission phrase in commentary.
    bi_isnadihi: "\\bباسناده[ام]?\\s+(?:إلى|الى|عن)\\b"
    # "بقراءتي / بقراءته" (by my/his reading) — audition method phrase.
    bi_qiraati: "\\bبقراءت[يه]\\b"
    # "فكأن" (as if) — commentary/editorial phrase.
    fa_kaanna: "\\bفكأن\\b"
    # "صلوات الله عليه" — Shia honorific formula, not part of name.
    honorific_salawat_shia: "\\bصلوات\\s+الله\\s+علي[هـ]"
    # "قدس الله روحه" — honorific for deceased scholar.
    honorific_quds: "\\bقدس\\s+(?:الله\\s+)?(?:روحه|سره)"
    # "إذا / إذ" — temporal/conditional clause start.
    idha_clause: "\\bإذ(?:ا)?\\s+(?:لا|لم|كان|جاء|دخل|قام)"
    # Dictionary definition patterns — "إذا جمعه" etc.
    dictionary_def: "\\bإذا\\s+(?:جمعه|فعله|قاله|ضربه)"
    # Persian text detection — Persian function words and verb endings.
    # Catches Persian content leaking into narrator names from bilingual books.
    persian_content: "\\sرا\\s|\\s(?:است|بود|شد[ه]?|شود|كرد|گفت(?:ند)?|آمد|نيست|باشد|نمايد|داشت[ه]?)\\b|\\bمى\\S|\\bنمى\\S|\\b(?:كه|چون|چنانچه|اگر|ولى|زيرا|بلكه|براى|سپس)\\s|\\bسخن\\s"
    # "لكن" (but/however) — introduces adversative clause, not a name.
    lakin_clause: "\\bلكن\\s"
    # "إنما" (only/indeed) — introduces emphatic clause.
    innama_clause: "\\bإنما\\s"
    # "انتهى" (end of quote) — editorial phrase marking end of citation.
    intaha: "\\bانتهى\\b"
    # "أن هذا / ان هذا" (that this) — content clause.
    an_hadha: "\\b[اأإ]ن\\s+هذ[اه]\\b"
    # "عليه السلام" honorific when followed by content clause.
    # This catches "الصادق عليه السلام ان ..." where the post-honorific content leaks.
    alayhis_salam_content: "\\bعليه[ام]?\\s+السلام\\s+(?:أن|ان|إن|انه|أنه)"
    # «guillemets» — editorial quotation marks signal named-entity boundaries.
    guillemet: "»"
    # "الذي/التي" (who/which) — relative clause, not part of name.
    relative_clause: "\\bالذي\\s|\\bالتي\\s"
    # "من جهة" (from the side of) — biographical/genealogical phrase.
    min_jiha: "\\bمن\\s+جهة\\b"
    # Folio/page markers in editorial brackets: (/ أ [4 / أ])
    folio_marker: "\\(/\\s*[أب]"
    # Parenthetical reference codes: (ح 98), (خ 87), (ك 149), (ر 31)
    paren_reference: "\\(\\s*[حخكر]\\s+\\d"
    # "فإن" (for indeed) — introduces causal/explanatory clause.
    fa_inna: "\\bفإن\\s"
    # "فاذهب / فاطلب" — imperative after fa-, not a name.
    fa_imperative: "\\bفا(?:ذهب|طلب|تق|سأل|نظر)\\b"
    # "لئن" (if indeed) — conditional clause start (common in sermons/Quran).
    la_in: "\\bلئن\\s"
    # "نقله" (he transmitted it) — cross-reference verb with pronoun suffix.
    naqalahu: "\\bنقله[ا]?\\b"
    # "ما خلا" (except for) — exclusion clause.
    ma_khala: "\\bما\\s+خلا\\b"
    # "يناقض / يقوم / يلزم" — present-tense verbs as content boundary.
    present_tense_content: "\\b(?:يناقض|يلزم|يقاس|يتوكأ)\\b"
    # "وبناء على" (and based on) — editorial/analytical phrase.
    bina_ala: "\\bوبناء\\s+على\\b"
    # "العبارة" (the phrase) — editorial/commentary reference.
    al_ibara: "\\bالعبارة\\b"
    # "إلى أصنام / إلى + non-name noun" — directional content.
    ila_content: "\\bإلى\\s+(?:أصنام|بيت|دار|أرض|مكان|بلاد|جبل)"
    # "فذكره / فذكرها" — fa- + cross-reference verb.
    fa_dhakara: "\\bف(?:ذكره[ا]?|رواه[ا]?|أخرجه[ا]?)\\b"
    # "جميعا" (together) — adverb after a name list, not a name.
    jamian: "\\bجميعا\\b"
    # "ليس" (is not) — negation clause.
    laysa: "\\bليس\\b"
    # "وقد" (and indeed) — editorial/narrative clause starter.
    wa_qad: "\\bوقد\\s"
    # "صحبت / صحبنا" (I accompanied / we accompanied) — content verb.
    sahibtu: "\\bصحب[تن]"
    # "تكلموا / تكلمت" (they/she spoke) — content verb.
    takallamu: "\\bتكلم[وت]"
    # "فهذه / فهذا / فهؤلاء" — demonstrative with fa-.
    fa_demonstrative: "\\bف(?:هذ[اهي]|هؤلاء)\\s"
    # "[في" — editorial bracket with preposition.
    bracket_content: "\\[في\\s"
    # "انا ابن" (I am the son of) — pronoun I + genealogy.
    ana_ibn: "\\b[اأ]نا\\s+(?:ابن|بنت)\\b"
    # "فليقل / فليشهد" — jussive with fa-li-.
    fa_li_jussive: "\\bفل(?:يقل|يشهد|يقم|ينظر|يأخذ|يصل)\\b"
    # "فكفى" (for sufficient is) — emphatic clause.
    fa_kafa: "\\bفكفى\\b"
    # "واكظم / واقصر / واسكن / واحذر / واصفح" — imperative with waw.
    wa_imperative: "\\bوا(?:كظم|قصر|سكن|حذر|صفح|كثر|ستصلح)\\b"
    # "فمن" (so whoever) — conditional with fa-.
    fa_man: "\\bفمن\\s"
    # "عده الشيخ" (the sheikh counted him) — biographical evaluation.
    addahu: "\\bعده\\s"
    # "فيقضون / فيقولون" — present tense with fa-.
    fa_present: "\\bفيقض|\\bفيقول|\\bفيأت"
    # "القضية في" (the case/incident in) — narrative content.
    al_qadiyya: "\\bالقضية\\s"
    # "يرفعون / يسندون" (they raise/attribute) — group verb content.
    group_verb: "\\b(?:يرفعون|يسندون|يحتجون|يستدلون)\\b"
    # "أدام الله / أيد الله" — prayer formula after scholar name.
    prayer_formula: "\\b(?:أدام|أيد|أعز|حفظ|نصر)\\s+الله\\b"
    # "لم يثنوا / لم ينتضل" — negated past with لم.
    lam_verb: "\\bلم\\s+ي"
    # "قد اتخذوا" — perfect with قد + plural.
    qad_verb: "\\bقد\\s+(?:اتخذ|استقر|علم|ثبت)"
    # "قائم أصلي" — present tense prayer/action after state.
    state_action: "\\bقائم[اة]?\\s+أصلي\\b"
    # "ألا تسمعون" (do you not hear) — rhetorical question.
    ala_tasmaun: "\\bألا\\s+[تي]"
    # "فإنما / فإنها" — emphatic explanatory clause.
    fa_innama: "\\bفإن(?:ما|ها|هم|ه)\\s"
    # "ما أنكروا" (they did not deny) — negated past.
    ma_past: "\\bما\\s+أنكر"
    # "نستعين" (we seek help) — liturgical/prayer phrase.
    nastaeen: "\\bنستعين\\b"
    # "لا في" (not in) — negation + preposition content.
    la_fi: "\\bلا\\s+في\\s"
    # "(ع)" Shia honorific abbreviation followed by content.
    honorific_ayn_content: "\\(ع[\\).\\s]\\s*(?:ي|ل|ف|و(?!عن\\b))"
    # "معلوما أن" — known-that clause.
    maʿluman: "\\bمعلوما?\\s+[اأإ]ن\\b"
    # Names starting with ya that are NOT content boundaries
    ya_names_not_boundary: ["يحيى", "يزيد", "يعقوب", "يوسف", "يونس"]

  sentence_start_disqualifiers:
    - "قد"
    - "أما"
    - "كما"
    - "هناك"
    - "من المعلوم"
    - "سقطت"
    - "أدخل"
    - "فات"
    - "وقد"
    - "لأن"
    - "قلت"
    - "سمع"
    - "هنا"
    - "فإن"
    - "كان"
    - "هذا"
    - "ذكر"
    - "وهذ"
    - "ولكن"
    - "ونظرا"
    - "ومنها"
    - "وقال"
    - "قال"
    - "من"


# ─────────────────────────────────────────────────────────────────────────────
# BIOGRAPHY EXTRACTION
# Domain-specific settings for biography person extraction in Phase 3.
# ─────────────────────────────────────────────────────────────────────────────
biography_extraction:
  # Structural delimiters that end a person name in biography spans.
  # Arabic comma, Latin comma, newline, or opening parenthesis.
  name_boundaries: "[،,\\.:\\n;]|\\(|\\s-\\s|فقال|\\sقال\\b|\\sفي\\b|\\sعن\\b|\\sعلى\\b|\\sوهو\\b|\\sوهي\\b|بقوله|قوله|مرفوعا|\\sعليه|\\sرضي\\b|\\sرحمه\\b|\\sرحمها\\b|\\sرحمهما\\b|\\sرحمهم\\b|\\sصلى\\b|\\sحواري\\b|\\sفارسا?\\b|\\sالخليفة\\b|\\sبأنه\\b|\\sأن\\b|\\sقد\\b|\\sكان\\b|\\sإن\\b|\\sحيث\\b|\\sبأن\\b|\\sلم\\b|\\sلقد\\b|\\sبطل\\b|\\sالأمير\\b"


# ─────────────────────────────────────────────────────────────────────────────
# NAME DECOMPOSITION
# Shared patterns for extracting kunya and laqab from person names.
# Used by biography, rijal, and hadith extractors via src/utils/names.py.
# ─────────────────────────────────────────────────────────────────────────────
name_decomposition:
  kunya_pattern: "(?:أبو|أبي|أبا|أمّ|أم)\\s+(?:عبد\\s+\\S+|\\S+)"
  laqab_boundaries: "[،,\\n]|\\(|[٠-٩0-9]"


# ─────────────────────────────────────────────────────────────────────────────
# RIJAL EXTRACTION
# Domain-specific settings for rijal entry extraction in Phase 3.
# ─────────────────────────────────────────────────────────────────────────────
rijal_extraction:
  # Structural delimiters that split a raw name region into segments.
  # Arabic comma, newline, or period+space. First segment = nasab chain.
  name_delimiters: "[،\\n]|\\.\\s"

  # Trailing date patterns stripped from name tails when no jarh/bracket
  # terminates the region. Detects abbreviated death markers (ت NNN),
  # date ranges (NNN-NNN ه), and lone year numbers.
  death_date_trail: "\\s+(?:ت\\s*\\d|مات\\b|توفي|ولد\\b|\\d{2,4}\\s*[-–]\\s*\\d{2,4}\\s*(?:ه|$)|\\d{2,4}\\s*(?:ه[ـ‍]?|أو\\b|$))"

  # Kunya prefix (أبو/أبي/أم) — validates names without genealogy markers.
  kunya_start: "^أ[بم][وي]\\s+"


# ─────────────────────────────────────────────────────────────────────────────
# SERVICES
# External service endpoints used by the pipeline.
# All URLs and timeouts live here — never hard-coded in Python.
# ─────────────────────────────────────────────────────────────────────────────
services:
  # sol-next2 port: the upstream services are disabled here. ruvector and ner
  # are substituted (narrator linking goes through registry.db; NER is off for
  # the v1 port). gazetteer and quran index loaders are wired in later
  # milestones once their data is vendored. The domain sections above this
  # block are ported verbatim from sol-next.
  ruvector:
    url: "http://127.0.0.1:6333"
    collection: "narrators"
    dimensions: 384
    enabled: false

  gazetteer:
    narrator_path: "data/sanadset/narrator_gazetteer_final.txt"
    sira_persons_path: "data/sira_persons/gazetteer.txt"
    enabled: false

  ner:
    url: "https://camel.fkhome.local"
    endpoint: "/farasa/ner"
    timeout_seconds: 45
    verify_ssl: false
    enabled: false

  quran:
    index_path: "data/quran/quran_clearquran.json"
    enabled: false


# ─────────────────────────────────────────────────────────────────────────────
# JARH/TA'DIL GRADES
# Tradition-aware narrator reliability scale.
# Sunni: Ibn Hajar's 12-level scale (1 = Sahabah, 12 = declared liar).
# Shia: Category-based scale (1 = emphatic thiqah, 7 = fabricator).
# ─────────────────────────────────────────────────────────────────────────────
jarh_tadil_grades:
  sunni:
    # Rank 1: Sahabah (handled by companion_exemption, not term-based)
    # Rank 2: Emphatic praise
    "ثقة ثبت": 2
    "ثقة عين": 2
    "ثقة عدل": 2
    "ثقة متقن": 2
    "ثقة ثبت حافظ": 2
    "حجة": 2
    "متقن": 2
    "ثبت": 2
    "أوثق الناس": 2
    "ثقة حافظ": 2
    # Rank 3: Single praise
    "ثقة": 3
    "ثقات": 3
    "عدل": 3
    # Rank 4: Slightly below
    "صدوق": 4
    "لا بأس به": 4
    "حسن الحديث": 4
    # Rank 5: Poor memory
    "صدوق يهم": 5
    "صدوق سيء الحفظ": 5
    "صدوق له أوهام": 5
    "صالح": 5
    "صالح الحديث": 5
    # Rank 6: Few narrations
    "مقبول": 6
    "لين الحديث": 6
    "لين": 6
    # Rank 7: Unknown state
    "مستور": 7
    "مجهول الحال": 7
    # Rank 8: Explicit weakness
    "ضعيف": 8
    "ضعفوه": 8
    "ليس بالقوي": 8
    "ليس بثقة": 8
    # Rank 9: True unknown
    "مجهول": 9
    # Rank 10: Abandoned
    "متروك": 10
    "واه": 10
    "واهي الحديث": 10
    # Rank 11: Accused liar
    "متهم بالكذب": 11
    "متهم": 11
    "منكر": 11
    "منكر الحديث": 11
    # Rank 12: Declared liar/fabricator
    "كذاب": 12
    "وضاع": 12
    "يضع الحديث": 12

  shia:
    # Authentication terms
    "ثقة ثقة": 1
    "ثقة ثبت": 1
    "ثقة عين": 1
    "ثقة عدل": 1
    "ثقة": 2
    "عدل": 2
    "عين": 2
    "وجه": 2
    "جليل القدر": 2
    "صدوق": 3
    "صالح": 3
    "خير": 3
    "لا بأس به": 3
    "فاضل": 3
    "حسن": 3
    # Criticism terms
    "ضعيف": 4
    "لين": 4
    "ضعفوه": 4
    "مجهول": 5
    "مهمل": 5
    "متروك": 5
    "واه": 5
    "منكر": 5
    "غالي": 6
    "غال": 6
    "متهم": 6
    "فاسق": 6
    "كذاب": 7
    "وضاع": 7
    "فاسد المذهب": 0


# ─────────────────────────────────────────────────────────────────────────────
# HADITH METHODOLOGY
# Tradition-specific grading rules, chain defect types, and corroboration
# logic. Python code reads these rules — never duplicates them.
# ─────────────────────────────────────────────────────────────────────────────
hadith_methodology:
  default_tradition: sunni
  default_methodology: standard

  chain_defect_types:
    - id: MURSAL
      description: "Narrator attributes to source but omits intermediaries"
      severity: "DA'IF"
    - id: MUNQATI
      description: "One narrator missing in the middle"
      severity: "DA'IF"
    - id: MUDAL
      description: "Two or more consecutive narrators missing"
      severity: "DA'IF"
    - id: MUALLAQ
      description: "Missing narrator(s) at compiler's end"
      severity: "DA'IF"
    - id: MUDALLAS
      description: "Narrator conceals a gap using ambiguous language"
      severity: "DA'IF"

  transmission_type:
    mutawatir_bypasses_grading: true

  grade_hierarchy:
    - MUTAWATIR
    - SAHIH_LI_DHATIHI
    - SAHIH_LI_GHAYRIHI
    - HASAN_LI_DHATIHI
    - HASAN_LI_GHAYRIHI
    - MUWATHTHAQ
    - QAWI
    - "DA'IF"
    - "DA'IF_JIDDAN"
    - MAWDU

  sunni:
    narrator_rank_to_grade:
      1: SAHIH_LI_DHATIHI
      2: SAHIH_LI_DHATIHI
      3: SAHIH_LI_DHATIHI
      4: HASAN_LI_DHATIHI
      5: HASAN_CONDITIONAL
      6: HASAN_CONDITIONAL
      7: "DA'IF"
      8: "DA'IF"
      9: "DA'IF"
      10: "DA'IF_JIDDAN"
      11: MAWDU
      12: MAWDU

    taqwiyah_eligible_ranks: [5, 6, 7, 8, 9]
    taqwiyah_blocked_ranks: [10, 11, 12]

    companion_exemption: true
    mursal_handling: reject

  shia:
    methodology: usuli_strict

    narrator_rank_to_grade:
      1: SAHIH_LI_DHATIHI
      2: SAHIH_LI_DHATIHI
      3: HASAN_LI_DHATIHI
      4: "DA'IF"
      5: "DA'IF"
      6: "DA'IF_JIDDAN"
      7: MAWDU
    thiqah_rank_max: 2

    narrator_category_rules:
      SAHIH_LEVEL:
        requires:
          imami: true
          thiqah: true
      HASAN_LEVEL:
        requires:
          imami: true
          praised: true
        excludes:
          thiqah: true
      MUWATHTHAQ_LEVEL:
        requires:
          thiqah: true
        excludes:
          imami: true
      QAWI_LEVEL:
        requires:
          imami: true
          no_evaluation: true
      DAIF_LEVEL:
        default: true

    tawthiq_amm_accepted:
      - kamil_al_ziyarat
      - mashayikh_najashi

    mursal_thiqah_override: true
    trusted_mursal_senders:
      - ibn_abi_umayr
      - safwan_ibn_yahya
      - al_bazanti

    tarjih_criteria:
      - narrator_quality
      - shuhra
      - muwafaqah_kitab
      - mukhalafah_ammah
      - ihtiyat

    four_books_qati: false


