    - ذي


# ─────────────────────────────────────────────────────────────────────────────
# NARRATOR EXTRACTION
# Domain-specific settings for hadith narrator extraction in Phase 3.
# ─────────────────────────────────────────────────────────────────────────────
narrator_extraction:
  relative_references:
    - "أبيه"
    - "أبوه"
    - "أمه"
    - "أمها"
    - "جده"
    - "جدته"
    - "عمه"
    - "عمته"
    - "أخيه"
    - "أخته"
    - "خاله"
    - "خالته"
    - "ابنه"
    - "ابنته"

  prepositional_an_exclusions:
    - "يمين"
    - "شمال"
    - "يسار"
    - "رأس"
    - "ظهر"
    - "جنب"
    - "وجه"
    - "فرس"
    - "سبيل"
    - "طريق"
    - "قلب"
    - "ذلك"
    - "هذا"
    - "هؤلاء"
    - "المدينة"
    - "الدنيا"
    - "الآخرة"
    - "نفسه"
    - "نفسها"
    - "نفسي"

  narrative_context_words:
    - "في"
    - "ذلك"
    - "هذا"
    - "شيئ"

  # Words after أنا that indicate it is the pronoun "I" (أنا أسمع = I was
  # listening), not the transmission abbreviation أنا = أخبرنا.
  pronoun_ana_exclusions:
    - "أسمع"
    - "أعلم"
    - "أعرف"
    - "أكتب"
    - "أقرأ"
    - "أنظر"
    - "أحفظ"
    - "أحسب"
    - "قائم"
    - "حاضر"
    - "معه"
    - "معهم"
    - "معها"
    - "شاهد"

  # Words that are never standalone narrator names (pronouns, common words)
  narrator_stopwords:
    - "هو"
    - "هي"
    - "هم"
    - "هن"
    - "هكذا"
    - "غيرهم"
    - "الحديث"
    - "فتى"
    - "يقول"

  transmission_tail_verbs:
    - "يحدث"
    - "يروي"
    - "يخبر"

  name_content_boundaries:
    # Patterns that mark where a narrator name ends and content begins
    an_clause_not_transmission: "\\bأنه[ام]?\\s+(?!سمع|حدث|أخبر|روى|ثنا|نبأ)"
    book_abbreviation_ref: "\\b(?:يب|كا|ئل|فقيه)\\s+\\d"
    topical_fi: "\\bفي\\s+(?:حديث|كتاب|باب|قول|رواية|تفسير|سورة|يب|كا|ئل|مسجد|مكة|المدينة|نار|عصمت)"
    nahw_formula: "\\bنحو\\s+ما\\b"
    mithluhu: "\\bمثله\\b"
    editorial_reference: "\\bوقد\\s+أوردنا"
    question_mark: "[؟?]"
    qala_colon: "\\bقال\\s*:\\s*\\S"
    an_not_name: "\\b[اأإ]ن\\s+(?!يحيى|يزيد|يعقوب|يوسف|يونس)\\S+\\s"
    fa_narrative_verbs: "\\bف(?:هل|لم|لما|إذا|قام|جاء|أخذ|دخل|خرج|قال|سأل)\\b"
    thumma_inna: "\\bثم\\s+إن\\b"
    vocative: "\\bيا\\s+"
    colon_separator: "\\s+:\\s+"
    saqita: "\\bساقطة\\b"
    kanat_prophet: "\\bكانت?\\s+(?:رسول|النبي|تحت)"
    # Transmission method phrases (صيغ الأداء) — follow the narrator name,
    # never part of it.  E.g. "الصواف قراءة عليه وأنا أسمع قال"
    transmission_method: "(?:قراءة|قرئ|عرض(?:ت|نا)?|سماعا?)\\s+(?:عليه|عليها|علينا|عليهم|من\\b)"
    audition_witness: "وأنا أسمع"
    # Honorific formulas that follow a person's name, never part of it.
    honorific_salawat: "\\bصلى\\s+الله\\s+عليه"
    honorific_praise: "\\bرضي\\s+الله\\s+عنه"
    # Demonstrative + content noun: "هذا الحديث" (this hadith) is content, not a name.
    demonstrative_content: "(?:هذا|هذه|بهذا|بهذه|لهذا|لهذه)\\s+(?:الحديث|الخبر|الأثر|القول|الرواية|الكتاب|الباب)"
    honorific_mercy: "\\bرحم[ةه]\\s+الله\\b"
    # Cross-reference verbs with pronoun suffixes — "رواه البيهقي" (he narrated it)
    # is a reference to another scholar's collection, never a narrator name.
    cross_reference_verb: "\\bو?(?:رواه[ا]?|أخرجه[ا]?|ذكره[ا]?|هكذا)\\b"
    # Pronoun "he/she" at start of name_slice is always commentary, never a name.
    pronoun_sentence_start: "^\\s*ه[وي]\\s"
    # Present-tense transmission verbs after a narrator name end the name.
    # Includes pronominal suffix forms (يحدثك, يحدثه, يرويه, etc.)
    transmission_tail: "\\b(?:يحدث|يروي|يخبر|يذكر)(?:ه[امن]?|ك[مـ]?|نا|ون)?\\b"
    # "كان من / كانت من" — biographical phrase ("was from the companions of..."),
    # never part of a narrator name.
    kana_min: "\\bكان[ت]?\\s+من\\b"
    # Narrator grading vocabulary — "ثقة" (trustworthy), "ضعيف" (weak), etc.
    # These follow a name as evaluation, never part of it.
    grading_phrase: "\\b(?:ثقة|ضعيف|كذاب|قليل الحديث|كثير الحديث|مجهول)\\b"
    # "وهو/وهي" + descriptive verb/adjective — circumstantial clause describing
    # state, never part of a narrator name.
    waw_huwa_descriptive: "\\bوه[وي]\\s+(?:يصلي|ينظر|جالس|قائم|واقف|متكئ|راكب|نائم|قاعد|مضطجع|من\\s+مشا[يئ]خ|مستقبل)"
    # "الحديث" at the end of a name_slice (with optional ellipsis/dots) is a
    # cross-reference, not part of the narrator name.
    trailing_hadith: "\\.\\s*\\.?\\s*\\.?\\s*الحديث|\\bالحديث\\s*\\d|\\bالحديث\\s*$"
    # "قد تقدم" (has preceded) — editorial cross-reference phrase.
    qad_taqaddama: "\\bقد\\s+تقدم\\b"
    # "إنه/إنها" (indeed he/she) — introduces content clause, not a name.
    # Distinguished from أنه which has its own boundary with transmission lookahead.
    innahu_content: "\\b[إا]نه[ام]?\\s+(?!سمع|حدث|أخبر|روى)"
    # "لأنه/لأنها" (because he/she) — causal clause.
    li_annahu: "\\bلأنه[ام]?\\s"
    # "أنه سمع" mid-name merges two narrators — treat as boundary.
    # Distinct from an_clause_not_transmission which has a lookahead that
    # allows "أنه سمع" as transmission. When it appears inside a name_slice
    # (between two attribution verbs), it signals a narrator boundary.
    anahu_samiʿa: "\\bأنه[ام]?\\s+سمع"
    # Reference numbers: ") . 6243" or similar — editorial apparatus.
    reference_number: "[)\\]]\\s*\\.?\\s*[-–]|[)\\]]\\s*\\.?\\s*\\d{3,}"
    # Poetry marker: * between hemistiches (with surrounding whitespace).
    poetry_marker: "\\s\\*\\s"
    # "كما" (as / just as) — introduces comparison or attestation clause.
    kama_clause: "\\bكما\\s+(?:صرح|يظهر|ذكر|قال|روى|نقل|تقدم|في\\b)"
    # "باسناده إلى" (with his chain to) — transmission phrase in commentary.
    bi_isnadihi: "\\bباسناده[ام]?\\s+(?:إلى|الى|عن)\\b"
    # "بقراءتي / بقراءته" (by my/his reading) — audition method phrase.
    bi_qiraati: "\\bبقراءت[يه]\\b"
    # "فكأن" (as if) — commentary/editorial phrase.
    fa_kaanna: "\\bفكأن\\b"
    # "صلوات الله عليه" — Shia honorific formula, not part of name.
    honorific_salawat_shia: "\\bصلوات\\s+الله\\s+علي[هـ]"
    # "قدس الله روحه" — honorific for deceased scholar.
    honorific_quds: "\\bقدس\\s+(?:الله\\s+)?(?:روحه|سره)"
    # "إذا / إذ" — temporal/conditional clause start.
    idha_clause: "\\bإذ(?:ا)?\\s+(?:لا|لم|كان|جاء|دخل|قام)"
    # Dictionary definition patterns — "إذا جمعه" etc.
    dictionary_def: "\\bإذا\\s+(?:جمعه|فعله|قاله|ضربه)"
    # Persian text detection — Persian function words and verb endings.
    # Catches Persian content leaking into narrator names from bilingual books.
    persian_content: "\\sرا\\s|\\s(?:است|بود|شد[ه]?|شود|كرد|گفت(?:ند)?|آمد|نيست|باشد|نمايد|داشت[ه]?)\\b|\\bمى\\S|\\bنمى\\S|\\b(?:كه|چون|چنانچه|اگر|ولى|زيرا|بلكه|براى|سپس)\\s|\\bسخن\\s"
    # "لكن" (but/however) — introduces adversative clause, not a name.
    lakin_clause: "\\bلكن\\s"
    # "إنما" (only/indeed) — introduces emphatic clause.
    innama_clause: "\\bإنما\\s"
    # "انتهى" (end of quote) — editorial phrase marking end of citation.
    intaha: "\\bانتهى\\b"
    # "أن هذا / ان هذا" (that this) — content clause.
    an_hadha: "\\b[اأإ]ن\\s+هذ[اه]\\b"
    # "عليه السلام" honorific when followed by content clause.
    # This catches "الصادق عليه السلام ان ..." where the post-honorific content leaks.
    alayhis_salam_content: "\\bعليه[ام]?\\s+السلام\\s+(?:أن|ان|إن|انه|أنه)"
    # «guillemets» — editorial quotation marks signal named-entity boundaries.
    guillemet: "»"
    # "الذي/التي" (who/which) — relative clause, not part of name.
    relative_clause: "\\bالذي\\s|\\bالتي\\s"
    # "من جهة" (from the side of) — biographical/genealogical phrase.
    min_jiha: "\\bمن\\s+جهة\\b"
    # Folio/page markers in editorial brackets: (/ أ [4 / أ])
    folio_marker: "\\(/\\s*[أب]"
    # Parenthetical reference codes: (ح 98), (خ 87), (ك 149), (ر 31)
    paren_reference: "\\(\\s*[حخكر]\\s+\\d"
    # "فإن" (for indeed) — introduces causal/explanatory clause.
    fa_inna: "\\bفإن\\s"
    # "فاذهب / فاطلب" — imperative after fa-, not a name.
    fa_imperative: "\\bفا(?:ذهب|طلب|تق|سأل|نظر)\\b"
    # "لئن" (if indeed) — conditional clause start (common in sermons/Quran).
    la_in: "\\bلئن\\s"
    # "نقله" (he transmitted it) — cross-reference verb with pronoun suffix.
    naqalahu: "\\bنقله[ا]?\\b"
    # "ما خلا" (except for) — exclusion clause.
    ma_khala: "\\bما\\s+خلا\\b"
    # "يناقض / يقوم / يلزم" — present-tense verbs as content boundary.
    present_tense_content: "\\b(?:يناقض|يلزم|يقاس|يتوكأ)\\b"
    # "وبناء على" (and based on) — editorial/analytical phrase.
    bina_ala: "\\bوبناء\\s+على\\b"
    # "العبارة" (the phrase) — editorial/commentary reference.
    al_ibara: "\\bالعبارة\\b"
    # "إلى أصنام / إلى + non-name noun" — directional content.
    ila_content: "\\bإلى\\s+(?:أصنام|بيت|دار|أرض|مكان|بلاد|جبل)"
    # "فذكره / فذكرها" — fa- + cross-reference verb.
    fa_dhakara: "\\bف(?:ذكره[ا]?|رواه[ا]?|أخرجه[ا]?)\\b"
    # "جميعا" (together) — adverb after a name list, not a name.
    jamian: "\\bجميعا\\b"
    # "ليس" (is not) — negation clause.
    laysa: "\\bليس\\b"
    # "وقد" (and indeed) — editorial/narrative clause starter.
    wa_qad: "\\bوقد\\s"
    # "صحبت / صحبنا" (I accompanied / we accompanied) — content verb.
    sahibtu: "\\bصحب[تن]"
    # "تكلموا / تكلمت" (they/she spoke) — content verb.
    takallamu: "\\bتكلم[وت]"
    # "فهذه / فهذا / فهؤلاء" — demonstrative with fa-.
    fa_demonstrative: "\\bف(?:هذ[اهي]|هؤلاء)\\s"
    # "[في" — editorial bracket with preposition.
    bracket_content: "\\[في\\s"
    # "انا ابن" (I am the son of) — pronoun I + genealogy.
    ana_ibn: "\\b[اأ]نا\\s+(?:ابن|بنت)\\b"
    # "فليقل / فليشهد" — jussive with fa-li-.
    fa_li_jussive: "\\bفل(?:يقل|يشهد|يقم|ينظر|يأخذ|يصل)\\b"
    # "فكفى" (for sufficient is) — emphatic clause.
    fa_kafa: "\\bفكفى\\b"
    # "واكظم / واقصر / واسكن / واحذر / واصفح" — imperative with waw.
    wa_imperative: "\\bوا(?:كظم|قصر|سكن|حذر|صفح|كثر|ستصلح)\\b"
    # "فمن" (so whoever) — conditional with fa-.
    fa_man: "\\bفمن\\s"
    # "عده الشيخ" (the sheikh counted him) — biographical evaluation.
    addahu: "\\bعده\\s"
    # "فيقضون / فيقولون" — present tense with fa-.
    fa_present: "\\bفيقض|\\bفيقول|\\bفيأت"
    # "القضية في" (the case/incident in) — narrative content.
    al_qadiyya: "\\bالقضية\\s"
    # "يرفعون / يسندون" (they raise/attribute) — group verb content.
    group_verb: "\\b(?:يرفعون|يسندون|يحتجون|يستدلون)\\b"
    # "أدام الله / أيد الله" — prayer formula after scholar name.
    prayer_formula: "\\b(?:أدام|أيد|أعز|حفظ|نصر)\\s+الله\\b"
    # "لم يثنوا / لم ينتضل" — negated past with لم.
    lam_verb: "\\bلم\\s+ي"
    # "قد اتخذوا" — perfect with قد + plural.
    qad_verb: "\\bقد\\s+(?:اتخذ|استقر|علم|ثبت)"
    # "قائم أصلي" — present tense prayer/action after state.
    state_action: "\\bقائم[اة]?\\s+أصلي\\b"
    # "ألا تسمعون" (do you not hear) — rhetorical question.
    ala_tasmaun: "\\bألا\\s+[تي]"
    # "فإنما / فإنها" — emphatic explanatory clause.
    fa_innama: "\\bفإن(?:ما|ها|هم|ه)\\s"
    # "ما أنكروا" (they did not deny) — negated past.
    ma_past: "\\bما\\s+أنكر"
    # "نستعين" (we seek help) — liturgical/prayer phrase.
    nastaeen: "\\bنستعين\\b"
    # "لا في" (not in) — negation + preposition content.
    la_fi: "\\bلا\\s+في\\s"
    # "(ع)" Shia honorific abbreviation followed by content.
    honorific_ayn_content: "\\(ع[\\).\\s]\\s*(?:ي|ل|ف|و(?!عن\\b))"
    # "معلوما أن" — known-that clause.
    maʿluman: "\\bمعلوما?\\s+[اأإ]ن\\b"
    # Names starting with ya that are NOT content boundaries
    ya_names_not_boundary: ["يحيى", "يزيد", "يعقوب", "يوسف", "يونس"]

  sentence_start_disqualifiers:
    - "قد"
    - "أما"
    - "كما"
    - "هناك"
    - "من المعلوم"
    - "سقطت"
    - "أدخل"
    - "فات"
    - "وقد"
    - "لأن"
    - "قلت"
    - "سمع"
    - "هنا"
    - "فإن"
    - "كان"
    - "هذا"
    - "ذكر"
    - "وهذ"
    - "ولكن"
    - "ونظرا"
    - "ومنها"
    - "وقال"
    - "قال"
    - "من"
services:
  # sol-next2 port: the upstream services are disabled here. ruvector and ner
  # are substituted (narrator linking goes through registry.db; NER is off for
  # the v1 port). gazetteer and quran index loaders are wired in later
  # milestones once their data is vendored. The domain sections above this
  # block are ported verbatim from sol-next.
  ruvector:
    url: "http://127.0.0.1:6333"
    collection: "narrators"
    dimensions: 384
    enabled: false

  gazetteer:
    narrator_path: "data/sanadset/narrator_gazetteer_final.txt"
    sira_persons_path: "data/sira_persons/gazetteer.txt"
    enabled: false

  ner:
    url: "https://camel.fkhome.local"
    endpoint: "/farasa/ner"
    timeout_seconds: 45
    verify_ssl: false
    enabled: false

  quran:
    index_path: "data/quran/quran_clearquran.json"
    enabled: false
