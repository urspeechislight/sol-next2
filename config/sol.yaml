# sol-next configuration
# All registries and thresholds in one file.
# Validation at startup catches every broken cross-reference.

# ─────────────────────────────────────────────────────────────────────────────
# PATTERNS
# Surface-level text detectors. Phase 2 runs these against span text.
# Each match becomes a Pattern object on the span.
# ─────────────────────────────────────────────────────────────────────────────
patterns:
  - id: ATTRIBUTION
    description: >
      Hadith transmission verbs and markers (حدثنا, أخبرنا, عن, روى).
      Includes common abbreviations: أنا (=أخبرنا), نا (=حدثنا).
      These abbreviations are extremely common in classical hadith collections
      (شرح السنة, المعجم الأوسط, etc.). False matches of أنا as pronoun "I"
      are filtered by _filter_false_attributions() using pronoun_ana_exclusions.

      start_threshold restricts ROUTING relevance to the first 120 chars of
      a span — a hadith chain has the transmission verb near the entry start,
      not buried hundreds of chars into narrative. Boundary detection
      (is_boundary) is unaffected by start_threshold.
    regex: "\\bو?(?:حدثنا|حدثني|ثنا|أنا|نا|أخبرنا|أخبرني|روى|روينا|أنبأنا|نبأنا|سمعت|سمعنا|بإسناده)\\b|وعن\\b|\\bعن\\b"
    is_boundary: true
    start_threshold: 120

  - id: ATTRIBUTION_STRONG
    description: >
      Unambiguous hadith transmission verbs only. Unlike ATTRIBUTION, this
      excludes the polysemous عن which can mean "about" in non-chain contexts.
      Used for behavior routing; ATTRIBUTION (with عن) remains for boundaries.
    regex: "\\bو?(?:حدثنا|حدثني|ثنا|أخبرنا|أخبرني|روى|روينا|أنبأنا|نبأنا|سمعت|سمعنا|بإسناده)\\b"

  - id: ATTRIBUTION_STRONG_INITIAL
    description: >
      Strong-attribution verb at the START of a span — a real hadith chain
      indicator, as opposed to a mid-text citation. A modern sīrah author
      writing "...فقد روى ابن هشام عن..." mid-paragraph (citation of a
      classical work) makes plain ATTRIBUTION_STRONG fire and triggers
      HADITH_TRANSMISSION variant 1 (priority 80), which is the wrong
      classification — the surrounding span is narrative, not a hadith.

      This pattern fires only when the strong-attribution verb sits within
      the first few chars of the span (after optional numbered/decorative
      prefix). Hadith collection entries — ``1 - حدثنا أبو بكر...``,
      ``حدثنا ابن إسحاق``, ``روى البخاري عن...`` — match. Narrative spans
      with mid-text citations do not.
    regex: "^[\\s(*0-9٠-٩\\-.\\)]*و?(?:حدثنا|حدثني|ثنا|أخبرنا|أخبرني|روى|روينا|أنبأنا|نبأنا|سمعت|سمعنا|بإسناده)\\b"
    start_threshold: 20

  - id: SPEECH_VERB_GENERIC
    description: >
      Generic speech verb (قال, يقول, قيل). Anchored with non-Arabic-letter
      lookarounds — Python's \b is ASCII-aware and is a no-op inside Arabic
      text, so unanchored stems would match as substrings of unrelated tokens
      (e.g. قال inside مقالات). The optional [وفبلك]?(?:ال)? prefix permits common
      Arabic clitics (conjunction و/ف, prepositions ب/ل/ك, definite article ال)
      so وقال and فيقول still match.
    regex: "(?<![؀-ۿ])[وفبلك]?(?:ال)?(?:قال|قالوا|قالت|يقول|قيل|ذكر|قلت)(?![؀-ۿ])"

  - id: MATN_BOUNDARY_HINT
    description: >
      Prophet attribution phrases that mark matn start. Used by Phase 3 for
      sanad/matn splitting, NOT for behavior routing. These phrases identify
      where the matn begins within a hadith — they do not indicate that a
      hadith chain exists.
    regex: "(?:قال|عن|أن|كان|أمر|نهى|سئل|رأيت)\\s+(?:رسول الله|النبي)|مرفوعا|رفعه|يرفعه|يبلغ به"

  - id: QURAN_REF
    description: Quranic quotation markers
    regex: "قال الله تعالى|قال تعالى|قوله تعالى|قوله عز وجل|﴿|\\bسورة"

  - id: GENEALOGY_CHAIN
    description: >
      Genealogy/isnad chain marker (ابن, بن, بنت). start_threshold restricts
      ROUTING relevance to the first 120 chars — a hadith chain's first
      narrator name appears at the very start of the entry, while a cited
      name buried in mid-narrative is incidental. Detection itself is
      unaffected by start_threshold (only the routing rules see the limit).
    regex: "\\bبن\\b|\\bابن\\b|\\bبنت\\b"
    start_threshold: 120

  - id: DEATH_MARKER
    description: >
      Death date marker (توفي, مات, وفاته). Anchored with non-Arabic-letter
      lookarounds so مات doesn't match inside قامات/علامات/أمات, etc. Optional
      [وفبلك]?(?:ال)? prefix permits Arabic clitics (e.g. وتوفي, فمات).
    regex: "(?<![؀-ۿ])[وفبلك]?(?:ال)?(?:توفي|توفيت|مات|ماتت|وفاته|وفاتها|المتوفى|المتوفاة)(?![؀-ۿ])"

  - id: BIRTH_MARKER
    description: >
      Birth date marker (ولد, مولده). Anchored so ولد doesn't match inside
      الولدان/أولاد/مولود. Optional [وفبلك]?(?:ال)? prefix permits Arabic clitics.
    regex: "(?<![؀-ۿ])[وفبلك]?(?:ال)?(?:ولد|ولدت|مولده|مولدها|نشأ)(?![؀-ۿ])"

  - id: PERSON_REF
    description: Person reference markers (الشيخ, الإمام, العالم)
    regex: "(?:الشيخ|الإمام|العالم|الحافظ|المحدث|الفقيه|القاضي|الأمير|الحاكم)\\b"

  - id: LAQAB_MARKER
    description: >
      Explicit laqab/epithet introduction (المعروف بـ, الملقب بـ).
      Phase 2 detection, consumed by Phase 3 extractors. Not for behavior routing.
    regex: "المعروف\\s+ب|يعرف\\s+ب|الملقب\\s+ب|المشهور\\s+ب"

  - id: FIQH_RULING
    description: >
      Legal ruling markers (يجب, يحرم, يستحب). Anchored with non-Arabic-letter
      lookarounds — without them يجب matches the prefix of يجبنوا ("they shrink
      back", root ج-ب-ن), فرض matches فرضية, etc. Optional [وفبلك]?(?:ال)?
      prefix permits Arabic clitics (الواجب, ويجب, فالواجب).

      Bare adjective حرام is intentionally NOT in this alternation: in
      sīrah/tarīkh genres it is a proper-noun attribute (البيت الحرام,
      المسجد الحرام, الشهر الحرام), and disambiguating per-clitic with
      Python's fixed-width lookbehinds is impractical. Real fiqh statements
      ("هذا حرام") are typically corroborated by the verbal forms يحرم /
      مكروه / يجب that remain in the alternation.
    regex: "(?<![؀-ۿ])[وفبلك]?(?:ال)?(?:يجب|يحرم|يكره|يستحب|يباح|فرض|واجب|مكروه|مندوب|مباح)(?![؀-ۿ])"

  - id: BASMALA
    description: Basmala (بسم الله الرحمن الرحيم)
    regex: "بسم\\s+الله\\s+الرحمن\\s+الرحيم"
    is_boundary: true

  - id: HEADING_MARKER
    description: >
      Structural heading keywords across genres, with optional ال prefix,
      decorative wrappers, and continuation prefixes (تتمة, بقية) for
      volumes that begin mid-chapter.
    regex: "^[\\s(*0-9٠-٩]*(?:(?:تتمة|بقية)\\s+)?(?:ال)?(?:كتاب|باب|فصل|فصول|مسألة|مسائل|مسند|قسم|مقصد|مبحث|مطلب|حرف|سورة|قول في|كلام في)(?=[\\s*()\\n]|$)"
    is_boundary: true
    heading_stop_patterns: ["الآيات"]
    heading_disqualifiers:
      - "\\s+فف"
      - "\\s+و[إأ]ن"
      - "\\s+(?!ال)\\S{2,}(?:هم|هما|هن|ها)\\b"
      - "\\s+(?:على|إلى|من|عن|مع|لدى|نحو)\\b"
    hierarchy_levels:
      kitab: ["كتاب", "مسند", "حرف", "سورة", "قسم"]
      bab: ["باب", "مسألة", "مسائل", "القول في", "الكلام في", "قول في", "كلام في", "مقصد", "مبحث"]
      fasl: ["فصل", "فصول", "مطلب"]

  - id: AUTHOR_COMMENTARY
    description: Author commentary markers (بيان, أقول)
    regex: "\\bبيان\\s*:|\\bأقول\\b|\\bتفسير\\s*:"
    is_boundary: true
    start_threshold: 20

  - id: HIJRI_YEAR
    description: >
      Hijri year mention in narrative. Common shapes:
        سنة 200 هـ      ("year 200 AH")
        في سنة 5 هـ    ("in year 5 AH")
        عام 150        ("year 150")
        (ت 150)        ("died 150" — short form)
        (150 هـ)       ("(150 AH)")
      Western digits and Arabic-Indic digits both supported.
    regex: "(?:\\bسنة\\s+|\\bعام\\s+|\\bفي\\s+سنة\\s+|\\bعام\\s+|\\bت\\s+)[٠-٩0-9]{1,4}(?:\\s*ه[ـ]?\\b|\\s*هجر\\S{0,5}|\\b)"

  - id: LUNAR_MONTH
    description: >
      Names of the twelve Islamic lunar months. Captured for narrative-date
      anchoring (events placed in شهر رمضان من العام ..., ذي الحجة, etc.).
      Phase 3 emits LUNAR_MONTH entities for each match.
    regex: "\\b(?:محرم|صفر|ربيع\\s+الأول|ربيع\\s+الآخر|ربيع\\s+الثاني|جمادى\\s+الأولى|جمادى\\s+الآخرة|جمادى\\s+الثانية|رجب|شعبان|رمضان|شوال|ذو\\s+القعدة|ذي\\s+القعدة|ذو\\s+الحجة|ذي\\s+الحجة)\\b"

  - id: CLASSICAL_SOURCE_ATTRIBUTION
    description: >
      Deterministic citation marker — an attribution verb (قال/يقول/ذكر/روى/أخرج)
      followed by a recognised classical-source author or work. Captured as the
      surface trigger; the citation_extractor turns it into a CITATION_REF entity
      whose text is the cited source. This is the per-claim asserter signal the
      council identified as the deterministic backbone of provenance — no LLM
      required when the author writes "قال ابن هشام".
    regex: "(?:قال|يقول|ذكر|روى|أخرج|نقل|أخبر|يحكي|يقص|يروي)\\s+(?:ابن\\s+هشام|ابن\\s+إسحاق|ابن\\s+سعد|ابن\\s+كثير|ابن\\s+حجر|ابن\\s+الأثير|ابن\\s+الجوزي|ابن\\s+قتيبة|ابن\\s+عبد\\s+ربه|الطبري|الواقدي|البيهقي|السيوطي|الذهبي|البخاري|مسلم|أبو\\s+داود|الترمذي|النسائي|ابن\\s+ماجه|أحمد|الزهري|الكليني|الصدوق|الطوسي|المفيد|المجلسي)"

  - id: JARH_TADIL
    description: Reliability assessment terminology (narrator grading terms)
    regex: "\\b(?:ثقة|ثقات|صدوق|ضعيف|ضعفوه|متروك|كذاب|مجهول|لا بأس به|ليس بثقة|حسن الحديث|صالح|منكر|واه|حجة|ثبت|متقن|لين|صالح الحديث)\\b"

  - id: ISNAD_BACK_REF
    description: Isnad back-reference — author references previous hadith's chain
    regex: "(?:و)?بهذا\\s+ال[اإ]سناد|بال[اإ]سناد\\s+(?:عنه|المتقدم|السابق)"
    start_threshold: 30

  - id: AN_CHAIN_INITIAL
    description: >
      Chain-initial عن — isnad begins with عن rather than an explicit
      transmission verb. Requires span-start anchoring via start_threshold
      to avoid matching the common prepositional عن ("about") mid-span.
    regex: "^\\s*و?عن\\s+"
    start_threshold: 5

  - id: NUMBERED_ENTRY
    description: >
      Numbered list entries (1., 1 -, ١., (1), ١), etc.). Accepts both
      suffix forms (``5.`` / ``5 -`` / ``5)``) and parenthesized form
      (``(5)`` / ``(٦٨٩)``) — the latter is common in indexed rijal works
      like al-Ajli's Maʿrifat al-Thiqāt where each narrator entry is
      prefixed ``(N)``. Negative lookahead ``(?!\s*[0-9٠-٩])`` blocks
      number-range shapes like ``23 - 26`` (Qurʾān verse-range refs:
      ``الأعراف: 23-26``) from being treated as list-item starts.
    regex: "^\\s*\\(?[١٢٣٤٥٦٧٨٩٠0-9]+(?:\\s*[.\\-]|\\))(?!\\s*[١٢٣٤٥٦٧٨٩٠0-9])"
    is_boundary: true

  - id: POETRY_BLOCK
    description: >
      Classical Arabic poetry — at least two consecutive lines, each composed
      of two hemistichs separated by a star delimiter ` * `. Requiring two
      lines avoids firing on a stray asterisk in prose. The deterministic
      backbone for POETRY behavior (no LLM needed — the typographic shape
      itself carries the signal in this corpus).
    regex: "(?:[^*\\n]{10,}\\s\\*\\s[^*\\n]{10,}\\n){2,}"

  - id: SUBSECTION_MARKER
    description: >
      Author-typeset subsection marker — a line that begins with ``* `` (an
      asterisk followed by a space and content). In modern sīrah/tarīkh
      works the author uses ``* X :`` lines to delimit subsections within
      a chapter (e.g. ``* صدى الدعوة في يثرب :``, ``* تمهيد :``). 160 such
      lines appear in the target sīrah book; this is the dominant
      structural signal of the corpus and the boundary splitter must fire
      on each one. The line-start anchor (with MULTILINE) keeps poetry
      hemistich asterisks (mid-line ` * `) from matching.
    regex: "^\\*\\s+\\S"
    is_boundary: true

  - id: LETTER_ENTRY
    description: >
      Arabic-letter list item (أ - X, ب - Y, ج - Z, ...). Authors use abjad
      ordering for sub-lists nested inside numbered lists or as a parallel
      structure (e.g. analytical points within a subsection). The first ten
      abjad letters are: أ ب ج د ه و ز ح ط ي. Same boundary semantics as
      NUMBERED_ENTRY — each item is its own paragraph-level unit.
    regex: "^(?:أ|ب|ج|د|ه|و|ز|ح|ط|ي|ك)\\s*[\\-\\)]"
    is_boundary: true

  - id: ORDINAL_ENTRY
    description: >
      Arabic ordinal-word list marker (أولا, ثانيا, ثالثا, ...). Used in
      modern Arabic prose to enumerate analytical points or steps. Each
      ordinal at line-start with optional colon starts a new list item.
      Same boundary semantics as NUMBERED_ENTRY. Forms covered: the
      adverbial accusative (أولاً written as أولا after tashkeel strip).
    regex: "^\\s*(?:أولا|ثانيا|ثالثا|رابعا|خامسا|سادسا|سابعا|ثامنا|تاسعا|عاشرا|حاديا|ثانيا\\s+عشر|ثالثا\\s+عشر)\\s*[:\\-]?"
    is_boundary: true


# ─────────────────────────────────────────────────────────────────────────────
# BEHAVIORS
# Routing table: pattern combinations → behavior labels.
# Phase 2 consults this after detecting patterns on a span.
#
# Rules:
#   requires:     ALL listed patterns must be present
#   any_of:       AT LEAST ONE listed pattern must be present
#   none_of:      behavior does NOT fire if ANY of these patterns are present
#   genre_gate:   behavior only activates for these book_type values
#   priority:     higher number wins when multiple behaviors match (default: 0)
# ─────────────────────────────────────────────────────────────────────────────
behaviors:
  - id: HADITH_TRANSMISSION
    description: >
      A complete hadith unit — contains both the isnad (narrator chain) and the
      matn (prophetic text). Classification requires evidence of an actual chain
      AT THE START of the span: either ATTRIBUTION_STRONG_INITIAL (strong verb
      within the first ~20 chars) or ISNAD_BACK_REF (chain back-reference).

      The "INITIAL" qualifier is the key — modern sīrah authors cite hadiths
      mid-paragraph using ``روى ابن هشام`` / ``سمع البيهقي``, which makes plain
      ATTRIBUTION_STRONG fire deep inside narrative spans. That match indicates
      a *citation*, not the surrounding span being a hadith transmission. Only
      a chain marker at the start of the span (or after a numbered prefix)
      is a true hadith-chain indicator.

      MATN_BOUNDARY_HINT (قال رسول الله) is a matn-start marker, not a chain
      indicator — prose that mentions the Prophet fires it but has no chain.
    any_of: [ATTRIBUTION_STRONG_INITIAL, ISNAD_BACK_REF]
    priority: 80

  - id: HADITH_TRANSMISSION
    description: >
      عن-chain hadith — isnad starts with عن rather than an explicit verb.
      Common in hadith collections where the compiler omits their own chain
      prefix. Requires a genealogy marker (بن/ابن) to distinguish from
      prepositional عن ("about X"). Lower priority than the primary rule.
    requires: [AN_CHAIN_INITIAL, GENEALOGY_CHAIN]
    none_of: [HEADING_MARKER]
    priority: 78

  - id: HADITH_TRANSMISSION
    description: >
      Numbered hadith in compilatory collections (Bihar al-Anwar, al-Kafi,
      Wasāʾil, Muṣannaf, etc.). Format: ``N - Narrator1 بن X عن Narrator2...``

      Variant correctness relies on the ``start_threshold`` set on the
      ATTRIBUTION and GENEALOGY_CHAIN patterns: both must have their
      earliest match within the first ~100 chars of the span for the rule
      to count them. That is the hadith-chain shape — a name with بن /
      ابن and a transmission verb عن or حدثنا in the opening tokens.

      Without those thresholds the rule fired too cheaply: a modern sīrah
      content list like ``5 - أن الوفد الإسلامي...`` has prepositional عن
      and a cited "X بن Y" name somewhere deep in the entry, which is NOT
      a hadith chain. Thresholds restrict the routing-relevant matches to
      the entry-start region.
    requires: [NUMBERED_ENTRY, ATTRIBUTION, GENEALOGY_CHAIN]
    none_of: [HEADING_MARKER]
    priority: 72

  - id: QURAN_VERSE
    description: >
      Standalone Quranic text or verse reference. Does not fire when ATTRIBUTION
      is present — a span beginning with a hadith chain that cites a Quran verse
      as dalil is a HADITH_TRANSMISSION, not a QURAN_VERSE. BASMALA guard
      prevents the basmala (already handled by its own behavior) from triggering
      QURAN_VERSE when corpus matching detects it. MATN_BOUNDARY_HINT guard
      blocks long narrative prose that *cites* a verse from being classified
      as a verse — the hint matches "قال رسول الله / النبي" which never
      appears in pure Quranic text.
    requires: [QURAN_REF]
    none_of: [ATTRIBUTION_STRONG, AN_CHAIN_INITIAL, BASMALA, MATN_BOUNDARY_HINT]
    priority: 90

  - id: BIOGRAPHY
    description: Biographical entry about a scholar or person
    requires: [PERSON_REF]
    any_of: [DEATH_MARKER, BIRTH_MARKER, GENEALOGY_CHAIN]
    priority: 70

  - id: BIOGRAPHY
    description: >
      Scholar / narrator biography in narrative-genre books (sīrah, tarīkh,
      genealogy). A numbered entry that contains a hijri year AND at least
      one birth or death marker is unambiguously a biographical entry —
      even when ATTRIBUTION_STRONG also fires (because the bio describes
      the scholar's own transmission activities: ``روى عن فلان``,
      ``سمع من فلان``). Without this rule those spans falsely classify as
      HADITH_TRANSMISSION variant 1 (priority 80) — the cheap-pattern
      false positive the user flagged on ``1 - أبان بن عثمان :``.

      Priority 81 sits ABOVE HADITH variant 1 (80) so the BIRTH+DEATH+
      HIJRI_YEAR triplet outranks the strong-attribution heuristic. The
      genre gate keeps fiqh and hadith books (where ``ت 200`` style
      narrator-death inserts mid-chain are common in legitimate hadiths)
      unaffected — only narrative genres get this override.
    requires: [NUMBERED_ENTRY, HIJRI_YEAR]
    any_of: [BIRTH_MARKER, DEATH_MARKER]
    none_of: [HEADING_MARKER, BASMALA, POETRY_BLOCK]
    genre_gate: [prophet-imams-biography, genealogy-biography, history-geography]
    priority: 81

  - id: AUTHOR_COMMENTARY
    description: Author commentary or explanation (بيان, أقول)
    requires: [AUTHOR_COMMENTARY]
    priority: 85

  - id: FIQH_RULING
    description: Legal ruling or juristic opinion
    requires: [FIQH_RULING]
    priority: 75

  - id: HISTORICAL_NARRATIVE
    description: >
      Modern authorial historical narrative — the dominant content type in
      sīrah/tarīkh/biography books. Genre-gated AND requires positive cues
      (classical-source attribution, hijri year, or lunar month). The
      genre gate alone is not the guardrail — the positive-cue requirement
      is what prevents this behavior from absorbing every paragraph in a
      sīrah book that happens to fall through. Spans with NO positive cue
      remain GENERAL_PROSE. Priority sits ABOVE HADITH_TRANSMISSION
      variant 3 (72) so the cheap-pattern false positives we identified
      in long modern narrative reclassify here rather than as hadith, but
      BELOW variant 1 (80) and variant 2 (78) so real hadith chains in
      sīrah books (when they exist) keep their HADITH label.
    requires: []
    any_of: [CLASSICAL_SOURCE_ATTRIBUTION, HIJRI_YEAR, LUNAR_MONTH]
    none_of: [HEADING_MARKER, BASMALA, POETRY_BLOCK]
    genre_gate: [prophet-imams-biography, genealogy-biography, history-geography]
    priority: 73

  - id: SECTION_HEADING
    description: Structural heading (kitab, bab, fasl)
    requires: [HEADING_MARKER]
    priority: 95

  - id: SECTION_HEADING
    description: >
      Author-typeset subsection (line starts with ``* X :``). Same behavior
      label as the keyword-based heading rule above so downstream atomizers/
      extractors don't need to distinguish — both feed into the
      SECTION_HEADING bucket. Slightly lower priority so a span that has
      BOTH a kitab/bab heading AND a subsection marker still routes via
      the higher-level structural keyword.
    requires: [SUBSECTION_MARKER]
    priority: 92

  - id: RIJAL_ENTRY
    description: Rijal narrator biography entry in a narrator assessment book
    requires: [NUMBERED_ENTRY]
    any_of: [PERSON_REF, GENEALOGY_CHAIN, DEATH_MARKER]
    genre_gate: [sunni-hadith-narrators, shia-hadith-narrators]
    priority: 85

  - id: POETRY
    description: >
      Span where classical Arabic poetry (at least two consecutive
      star-delimited lines) is the strongest detected signal. Priority is
      deliberately LOW (65) — below HADITH_TRANSMISSION/AUTHOR_COMMENTARY/
      FIQH_RULING — because a hadith or fiqh discussion that quotes a couplet
      is not "poetry"; only a span whose strongest signal is the poetic shape
      gets the POETRY label. Pure-poetry spans (qasida quotations) fire here.
    requires: [POETRY_BLOCK]
    priority: 65

  - id: BASMALA
    description: Standalone basmala (بسم الله الرحمن الرحيم) — structural section opener
    requires: [BASMALA]
    priority: 50

  - id: NUMBERED_ENTRY
    description: Numbered list entry
    requires: [NUMBERED_ENTRY]
    priority: 60

  - id: NUMBERED_ENTRY
    description: >
      Arabic-letter list entry (أ - X, ب - Y, ج - Z, ...). Routed to the
      same NUMBERED_ENTRY behavior label so downstream atomizers and
      extractors don't need to distinguish — both are list items emitting
      ENTRY_UNIT. Lower priority than the digit-numbered variant.
    requires: [LETTER_ENTRY]
    priority: 58

  - id: NUMBERED_ENTRY
    description: >
      Arabic ordinal-word list entry (أولا :, ثانيا :, ثالثا :, ...).
      Routed to NUMBERED_ENTRY so downstream consumers don't fork.
    requires: [ORDINAL_ENTRY]
    priority: 57

  - id: GENERAL_PROSE
    description: Default behavior for content with no specific pattern match
    requires: []
    priority: 0

  - id: EDITORIAL_FRONTMATTER
    description: >
      Pages before the main content starts, as determined by TOC analysis.
      Assigned by content-boundary detection, not pattern routing.
    requires: []
    priority: -1


# ─────────────────────────────────────────────────────────────────────────────
# ATOMICIZERS
# How to split each behavior's spans into atomic units.
# Phase 3 looks up the behavior here.
# ─────────────────────────────────────────────────────────────────────────────
atomicizers:
  HADITH_TRANSMISSION:
    strategy: sanad_matn_split
    unit_types:
      isnad: ISNAD_UNIT
      matn: MATN_UNIT
    fallback_unit_type: HADITH_UNIT

  AUTHOR_COMMENTARY:
    strategy: whole_span
    unit_type: COMMENTARY_UNIT

  QURAN_VERSE:
    strategy: whole_span
    unit_type: QURAN_UNIT

  BIOGRAPHY:
    strategy: whole_span
    unit_type: BIOGRAPHY_UNIT

  FIQH_RULING:
    strategy: whole_span
    unit_type: FIQH_UNIT

  SECTION_HEADING:
    strategy: whole_span
    unit_type: HEADING_UNIT

  RIJAL_ENTRY:
    strategy: whole_span
    unit_type: RIJAL_UNIT

  NUMBERED_ENTRY:
    strategy: whole_span
    unit_type: ENTRY_UNIT

  BASMALA:
    strategy: whole_span
    unit_type: BASMALA_UNIT
    use_pattern_text: BASMALA

  POETRY:
    strategy: whole_span
    unit_type: POETRY_UNIT

  HISTORICAL_NARRATIVE:
    strategy: whole_span
    unit_type: HISTORICAL_NARRATIVE_UNIT

  GENERAL_PROSE:
    strategy: whole_span
    unit_type: PROSE_UNIT

  EDITORIAL_FRONTMATTER:
    strategy: whole_span
    unit_type: EDITORIAL_UNIT

  _special_unit_types:
    footnote: FOOTNOTE_UNIT


# ─────────────────────────────────────────────────────────────────────────────
# EXTRACTORS
# Which extractors to run per behavior.
# Phase 3 looks up behavior here to find which extractors to invoke.
# (Extractor implementations live in src/extractors/ — not yet built)
# ─────────────────────────────────────────────────────────────────────────────
extractors:
  HADITH_TRANSMISSION:
    - narrator_extractor
    - quran_verse_extractor
    - citation_extractor
    - date_expression_extractor
    - gazetteer_person_extractor
    - ner_person_extractor
  AUTHOR_COMMENTARY:
    - quran_verse_extractor
    - citation_extractor
    - date_expression_extractor
    - gazetteer_person_extractor
    - ner_person_extractor
  QURAN_VERSE:
    - quran_verse_extractor
  BIOGRAPHY:
    - person_extractor
    - date_extractor
    - quran_verse_extractor
    - citation_extractor
    - date_expression_extractor
    - gazetteer_person_extractor
    - ner_person_extractor
  RIJAL_ENTRY:
    - rijal_entry_extractor
    - narrator_extractor
    - date_extractor
    - gazetteer_person_extractor
    - ner_person_extractor
  FIQH_RULING:
    - quran_verse_extractor
    - citation_extractor
    - date_expression_extractor
    - gazetteer_person_extractor
    - ner_person_extractor
  SECTION_HEADING:
    - quran_verse_extractor
    - theme_extractor
  BASMALA: []
  NUMBERED_ENTRY:
    - gazetteer_person_extractor
    - ner_person_extractor
  POETRY: []
  GENERAL_PROSE:
    - quran_verse_extractor
    - citation_extractor
    - date_expression_extractor
    - gazetteer_person_extractor
    - ner_person_extractor
  HISTORICAL_NARRATIVE:
    - citation_extractor
    - date_expression_extractor
    - quran_verse_extractor
    - gazetteer_person_extractor
    - ner_person_extractor
