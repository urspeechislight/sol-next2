<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shia Online Library</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500;1,6..72,600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Vazirmatn:wght@300;400;500;600;700&family=Scheherazade+New:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="app-shell.css" />
    <link rel="stylesheet" href="screens-home.css" />
    <link rel="stylesheet" href="screens-home-eyebrow.css" />
    <link rel="stylesheet" href="screens-home-hero.css" />
    <link rel="stylesheet" href="screens-home-cabinet.css" />
    <link rel="stylesheet" href="screens-home-daily.css" />
    <link rel="stylesheet" href="screens-home-instrument.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--color-bg-0);
        color: var(--color-fg-1);
        font-family: var(--font-sans);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      button {
        font-family: inherit;
      }
      /* highlight for query hits */
      mark.q-hit {
        background: var(--color-accent-soft);
        color: var(--color-accent);
        padding: 0 2px;
        border-radius: 3px;
      }
      /* slim scrollbars in scrollable panes */
      .scroll-thin::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .scroll-thin::-webkit-scrollbar-thumb {
        background: var(--color-border-2);
        border-radius: 3px;
      }
      .scroll-thin::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React + Babel (pinned, integrity-checked) -->
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <!-- Data + API client + design-system + primitives + tweaks shell -->
    <script src="lib/routes.js"></script>
    <script src="data-domains.js"></script>
    <script src="data.js"></script>
    <script type="text/babel" src="lib/api/index.jsx"></script>
    <script type="text/babel" src="lib/design-system/variants.jsx"></script>
    <script type="text/babel" src="primitives.jsx"></script>
    <script type="text/babel" src="components.jsx"></script>
    <script type="text/babel" src="lib/design-system/internal/book-glyph.jsx"></script>
    <script type="text/babel" src="components-book-row.jsx"></script>
    <script type="text/babel" src="components-book.jsx"></script>
    <script type="text/babel" src="tweaks-panel.jsx"></script>
    <script type="text/babel" src="tweaks-controls.jsx"></script>

    <!-- Screens -->
    <script type="text/babel" src="screens-home-eyebrow.jsx"></script>
    <script type="text/babel" src="screens-home-daily.jsx"></script>
    <script type="text/babel" src="screens-home-instrument-panels.jsx"></script>
    <script type="text/babel" src="screens-home-instrument.jsx"></script>
    <script type="text/babel" src="screens-home-cabinet.jsx"></script>
    <script type="text/babel" src="screens-home-hero.jsx"></script>
    <script type="text/babel" src="screens-home.jsx"></script>
    <script type="text/babel" src="screens-library.jsx"></script>
    <script type="text/babel" src="screens-search.jsx"></script>
    <script type="text/babel" src="screens-page.jsx"></script>
    <script type="text/babel" src="screens-isnad.jsx"></script>
    <script type="text/babel" src="screens-reader-controls.jsx"></script>
    <script type="text/babel" src="screens-reader-toc.jsx"></script>
    <script type="text/babel" src="screens-reader.jsx"></script>

    <!-- App root — header/footer split so app.jsx stays focused on
         routing. app-header.jsx must load first so window.SOL_APP_HEADER
         exists when AppRoot destructures it. -->
    <script type="text/babel" src="app-header.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>
  </body>
</html>
